.rc-gp b{display:grid;place-items:center;width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;font-size:19px;font-weight:900;box-shadow:0 5px 12px color-mix(in srgb,var(--c) 40%,transparent),inset 0 -4px 0 rgba(0,0,0,.15)}
.rc-gp small{font-size:10.5px;font-weight:900;color:#6b7c99;white-space:nowrap}
.rc-gp button:active b,.rc-gp button.hit b{transform:scale(.9)}
.file-pend{display:block;margin-top:4px;padding:4px 9px;border-radius:10px;background:#fff7ed;color:#b45309;font-size:12.5px;font-weight:800;line-height:1.3}
.btn.gdoc.pend{animation:gpPend 1.6s ease-in-out infinite}
@keyframes gpPend{50%{box-shadow:0 0 0 6px rgba(66,133,244,.28)}}
.nt-btn{right:130px}
#rcBtn[hidden]~.nt-btn{right:74px}
.nt-btn svg{width:22px;height:22px}
.nt-btn .nt-sun,html.night .nt-btn .nt-moon{display:none}
html.night .nt-btn .nt-sun{display:block}
html.ses .nt-btn{display:none}
.nt-msg{position:absolute;left:0;right:0;bottom:12vh;margin:0;text-align:center;font:900 clamp(20px,3.4vw,34px)/1.2 Nunito,system-ui,sans-serif;color:#3b4a7a;animation:fnIn .6s .6s both}
html.night:not(.ses){filter:invert(1) hue-rotate(180deg);background:#0a0e17}
html.night:not(.ses) dialog:not(.rcfull){filter:invert(1) hue-rotate(180deg)}
html.night:not(.ses) :is(img,video,iframe,canvas,.robot,svg[width="96mm"],.fwd-btn,dialog .tk-top),html.night:not(.ses) #splash .sp-moli{filter:invert(1) hue-rotate(180deg)!important}
html.night:not(.ses) :is(.gpx,#sqx,#shh2,dialog.rcfull) :is(img,video,iframe,canvas,.robot,svg[width="96mm"]){filter:none!important}
html.night:not(.ses) .ar-card{filter:invert(1) hue-rotate(180deg);background:#05070d!important;color:#fff!important}
html.night:not(.ses) .ar-card :is(b,strong,span){color:#fff!important;-webkit-text-fill-color:#fff}
html.night:not(.ses) .ar-card small{color:#aab4c8!important;-webkit-text-fill-color:#aab4c8}
html.night:not(.ses) .ar-card.ar-off{filter:invert(1) hue-rotate(180deg) brightness(.75);opacity:.7}
html.night:not(.ses) .ar-card:is(:hover,:focus-visible,:active){box-shadow:0 0 0 2px rgba(255,255,255,.35),0 22px 48px rgba(0,0,0,.5)}
.rc-thm{flex:none;width:34px;height:34px;margin-right:auto;padding:0;border:0;border-radius:50%;background:#fff;font-size:16px;line-height:1;box-shadow:0 4px 12px rgba(30,60,120,.1);cursor:pointer}
dialog.tk.rcfull .rc-an{gap:8px}
dialog.tk.rcfull .rc-an button{flex-direction:row;justify-content:center;gap:5px;padding:9px 4px;border-radius:14px}
dialog.tk.rcfull .rc-an svg{width:17px;height:17px}
dialog.tk.rcfull .rc-an small{font-size:12px}
dialog.tk.rcfull .rc-card:has(.rc-an,.rc-anpick){gap:8px;padding:10px 12px 12px}
dialog.tk.rcfull.rcdark{background:linear-gradient(170deg,#0b1222,#111a30)!important;color:#e2e8f0}
dialog.tk.rcdark .rc-card{background:#18233b;box-shadow:0 8px 22px rgba(0,0,0,.35)}
dialog.tk.rcdark .rc-card h4,dialog.tk.rcdark .rc-sel small,dialog.tk.rcdark .rc-vis small,dialog.tk.rcdark .rc-tmx>small,dialog.tk.rcdark .rc-gp small{color:#94a3c4}
dialog.tk.rcdark .rc-card h4::after{border-color:#94a3c4}
dialog.tk.rcdark .rc-sel select{background:#22304d;color:#f1f5ff;border-color:#2c3c5e}
dialog.tk.rcdark .rc-sw{background:#22304d}
dialog.tk.rcdark .rc-sw:not(.on) i{background:#3a4a6b}
dialog.tk.rcfull .rc-card.rc-pad{flex:none}
dialog.tk.rcfull .tk-step.rc{justify-content:flex-start}
dialog.tk.rcdark .rc-cross button:not(.k),dialog.tk.rcdark .rc-cross .c{background:#22304d;color:#a9c4f5;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
dialog.tk.rcdark .rc-cross .k.rc-fs{background:#1e3a66;color:#cfe0ff}

dialog.tk.rcdark .rc-tmx{border-color:#2c3c5e}
dialog.tk.rcdark .rc-tmd{background:#22304d;color:#7f8fb0}
dialog.tk.rcdark .rc-tmd.on,dialog.tk.rcdark .rc-tmx .rc-tmo button{background:#1e3a66;color:#cfe0ff}
dialog.tk.rcdark .rc-tmq{background:#4a1d24;color:#ffb4b4}
dialog.tk.rcdark .rc-an button,dialog.tk.rcdark .rc-an button.c1,dialog.tk.rcdark .rc-an button.c2{background:#22304d!important;color:#d6ccff;box-shadow:none}
dialog.tk.rcdark .rc-aned{background:#22304d;color:#cfe0ff}
dialog.tk.rcdark .rc-anpick label{color:#e2e8f0}
dialog.tk.rcdark .rc-anpick select{background:#22304d;color:#f1f5ff;border-color:#2c3c5e}
dialog.tk.rcdark .rc-x,dialog.tk.rcdark .rc-thm,dialog.tk.rcdark .rc-av{background:#22304d;color:#cbd5e1;box-shadow:none}
dialog.tk.rcdark .rc-dot{border-color:#0b1222}

vidad 02",file:"f3"}],ticket:{questions:[{q:"¿Qué es una enfermedad infecciosa?",options:["Es causada por un agente infeccioso como un virus, una bacteria, un hongo o un parásito","Es causada solo por dormir poco","Es una enfermedad que solo tienen los adultos mayores"],answer:0,why:"Las enfermedades infecciosas son causadas por agentes infecciosos y pueden propagarse."},{q:"La influenza y el dengue son enfermedades causadas por…",options:["La falta de hierro","Un virus","El exceso de azúcar en la sangre"],answer:1,why:"En los casos de Lucía y Mariana, el médico explicó que las causa un virus."},{q:"¿Cuál de estas enfermedades es NO infecciosa?",options:["Tuberculosis","Dengue","Diabetes"],answer:2,why:"La diabetes no es causada por virus, bacterias, hongos ni parásitos."},{q:"¿Cómo llega el dengue a las personas?",options:["Por la picadura de un mosquito infectado","Por comer alimentos con poco hierro","Por tomar agua muy fría"],answer:0,why:"El virus del dengue se transmite mediante la picadura de un mosquito infectado."},{q:"¿Cuál es la diferencia principal entre una enfermedad infecciosa y una no infecciosa?",options:["Las infecciosas nunca tienen síntomas","En la infecciosa interviene un agente infeccioso y puede propagarse; en la no infecciosa no","No hay ninguna diferencia entre ellas"],answer:1,why:"La clave está en la causa: si interviene o no un agente infeccioso."}]}},{title:"",meta:"Explica el fenómeno de la actividad de la levadura para delimitar una relación investigable.",criteria:["Observa","Registra","Describe"],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"Observamos y registramos la actividad de la levadura",desc:"Observan la fermentación de la levadura, registran los cambios en una tabla y analizan lo ocurrido.",ficha:"Ficha · Sesión 2",file:"f4"},{mode:"individual",title:"De los datos a una relación investigable",desc:"A partir de lo observado, identifican un factor que podrían modificar y medir en una próxima experiencia.",ficha:"Ficha · Sesión 2",file:"f4"}],ticket:{questions:[{q:"¿Qué es la levadura?",options:["Un microorganismo formado por una sola célula","Una planta con hojas y raíces","Un tipo de azúcar"],answer:0,why:"La levadura es un ser vivo microscópico formado por una sola célula."},{q:"¿Qué gas libera la levadura durante la fermentación?",options:["Oxígeno","Dióxido de carbono","Vapor de agua"],answer:1,why:"Durante la fermentación la levadura produce dióxido de carbono."},{q:"¿Qué necesita la levadura para realizar la fermentación?",options:["Solo luz solar","Sal y aceite","Agua, azúcar y una temperatura adecuada"],answer:2,why:"Con agua, azúcar y temperatura adecuada la levadura se activa."},{q:"¿Por qué se formó espuma en la mezcla?",options:["Por las burbujas del gas que liberó la levadura","Porque el agua se congeló","Porque el azúcar desapareció en el aire"],answer:0,why:"Las burbujas de dióxido de carbono ayudan a formar la espuma."},{q:"¿Con qué instrumento medimos la altura de la espuma?",options:["Con un termómetro","Con una regla","Con una balanza"],answer:1,why:"La altura se mide con una regla y se registra en centímetros."}]}},{title:"",meta:"Formula una pregunta que pueda responderse mediante una indagación experimental.",criteria:["Selecciona un factor","Selecciona un efecto","Relaciona causa y efecto"],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"Formulamos individualmente una pregunta de indagación",desc:"Cada estudiante identifica el factor y el efecto de la indagación, y formula su propia pregunta con el andamio dado.",ficha:"Ficha · Sesión 3",file:"f5"},{mode:"group",title:"Construimos la pregunta de indagación del equipo",desc:"En equipos de 3 o 4, comparan sus preguntas individuales y construyen y mejoran una pregunta grupal de indagación.",ficha:"Ficha · Sesión 3",file:"f5"}],ticket:{questions:[{q:"En nuestra indagación, ¿qué factor vamos a cambiar intencionalmente?",options:["La temperatura in
