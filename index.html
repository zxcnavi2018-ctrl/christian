<style>
  :root{
    --bg1:#eaf2ff;
    --bg2:#dff3ff;
    --navy:#12224a;
    --navy-2:#1c2f5e;
    --blue:#2f6fed;
    --cyan:#38d1f5;
    --ink-2:#4a5a86;
    --ink-3:#7d8bb0;
    --card:#ffffff;
    --line:#dfe8fb;
    --soft:#f4f8ff;
    --amber:#f5a623;
    --amber-2:#f57c23;
    --green:#1f8a4c;
    --green-bg:#e3f5ea;
    --violet:#5b4fe0;
    --violet-bg:#eeedff;
    --red:#c0392b;
    --grad:linear-gradient(135deg, var(--blue), var(--cyan));
    --shadow-sm:0 4px 12px rgba(18,34,74,.07);
    --shadow:0 14px 32px rgba(18,34,74,.11);
    --shadow-lg:0 24px 50px rgba(18,34,74,.18);
    --radius:22px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --font:'Nunito', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    --eye:#3cc3f0;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--bg2); }
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font);
    color:var(--navy);
    background:transparent;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{ font:inherit; color:inherit; }
  button, [role="button"], .robot{ -webkit-touch-callout:none; }
  :focus{ outline:none; }
  :focus-visible{ outline:3px solid rgba(47,111,237,.55); outline-offset:3px; border-radius:12px; }
  [hidden]{ display:none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- Decorative background ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 12% 8%, #ffffff 0%, transparent 42%),
      radial-gradient(circle at 92% 88%, #d3e9ff 0%, transparent 48%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
  }
  .deco{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .deco svg{ position:absolute; color:var(--blue); opacity:.10; animation:drift var(--d,18s) ease-in-out infinite alternate; }
  .deco svg:nth-child(even){ color:var(--cyan); opacity:.16; }
  @keyframes drift{
    from{ transform:translate(0,0) rotate(0deg); }
    to{ transform:translate(var(--x,14px), var(--y,-22px)) rotate(var(--r,14deg)); }
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(60px); opacity:.55; pointer-events:none; z-index:0; }
  .blob.b1{ width:340px; height:340px; background:#cfe3ff; top:-90px; right:-80px; }
  .blob.b2{ width:300px; height:300px; background:#c9f1ff; bottom:-100px; left:-90px; }

  #app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1040px;
    margin:0 auto;
    padding:22px 22px 56px;
  }

  /* ---------- Screens ---------- */
  .screen{
    display:none;
    min-height:calc(100vh - 78px);
    min-height:calc(100dvh - 78px);
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .screen.active{ display:flex; }
  .screen.top{ justify-content:flex-start; padding-top:6px; }
  .screen.anim-fwd{ animation:inFwd .5s var(--ease) both; }
  .screen.anim-back{ animation:inBack .5s var(--ease) both; }
  .screen.anim-side{ animation:inSide .45s var(--ease) both; }
  @keyframes inFwd{ from{ opacity:0; transform:translateY(18px) scale(.985); } to{ opacity:1; transform:none; } }
  @keyframes inBack{ from{ opacity:0; transform:translateY(-14px) scale(.985); } to{ opacity:1; transform:none; } }
  @keyframes inSide{ from{ opacity:0; transform:translateX(26px); } to{ opacity:1; transform:none; } }
  @keyframes popIn{ from{ opacity:0; transform:translateY(14px) scale(.97); } to{ opacity:1; transform:none; } }

  /* ---------- Floating round buttons ---------- */
  .fab{
    position:fixed;
    top:18px;
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:60;
    transition:transform .25s var(--spring), background .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .back-btn{
    left:18px;
    background:var(--navy);
    color:#fff;
    box-shadow:0 10px 22px rgba(18,34,74,.28);
  }
  @media (hover:hover){ .back-btn:hover{ transform:translateY(-2px) scale(1.07); background:var(--blue); } }
  .back-btn:active{ transform:scale(.92); }
  .back-btn svg{ width:25px; height:25px; transform:rotate(-45deg); }
  .fs-btn{
    right:18px;
    width:46px;
    height:46px;
    top:22px;
    background:rgba(255,255,255,.75);
    color:var(--navy-2);
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .fs-btn:hover{ transform:scale(1.07); background:#fff; }
  .fs-btn svg{ width:20px; height:20px; }

  /* ---------- Robot ---------- */
  .robot{
    position:relative;
    width:var(--rw, 160px);
    flex-shrink:0;
    container-type:inline-size;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .robot-bob{ position:relative; animation:bob 3.4s ease-in-out infinite; }
  .robot-hop{ position:relative; }
  .robot.hop .robot-hop{ animation:hop .7s var(--spring); }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8%); } }
  @keyframes hop{
    0%{ transform:translateY(0) scale(1,1); }
    25%{ transform:translateY(4%) scale(1.06,.92); }
    55%{ transform:translateY(-14%) scale(.96,1.05) rotate(-4deg); }
    80%{ transform:translateY(0) scale(1.03,.97) rotate(2deg); }
    100%{ transform:none; }
  }

  }
  .robot-eyes{
    position:absolute;
    inset:0;
    transition:transform .18s ease-out;
    pointer-events:none;
  }
  .eye{
    position:absolute;
    top:17.1%;
    width:9%;
    height:18.3%;
    border-radius:50% / 30%;
    background:radial-gradient(ellipse at 38% 28%, #b8f1ff 0 16%, var(--eye) 42%);
    box-shadow:0 0 1.6cqw rgba(60,195,240,.75);
    transform-origin:50% 55%;
    animation:blink 5.2s infinite;
    animation-delay:var(--blink, 0s);
    transition:top .2s var(--ease), height .2s var(--ease), border-radius .2s var(--ease), background .2s ease;
  }
  .eye.l{ left:31.2%; }
  .eye.r{ left:58.1%; }
  @keyframes blink{
    0%, 91%, 97%, 100%{ transform:scaleY(1); }
    94%{ transform:scaleY(.08); }
  }
  .robot.happy .eye{
    top:22.5%;
    height:8.5%;
    background:transparent;
    border:2.3cqw solid var(--eye);
    border-bottom:0;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    animation:none;
  }
  .robot.talking .eye{ animation:talk .32s ease-in-out infinite alternate; }
  @keyframes talk{ from{ filter:brightness(1); } to{ filter:brightness(1.35); transform:scaleY(.9); } }
  .robot-shadow{
    display:block;
    width:56%;
    height:9cqw;
    margin:4% auto 0;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(18,34,74,.26) 0%, rgba(18,34,74,0) 70%);
    animation:shadowPulse 3.4s ease-in-out infinite;
  }
  @keyframes shadowPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.8); opacity:.6; } }

  /* ---------- HOME ---------- */
  .home{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:6px;
    padding:18px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    border-radius:32px;
  }
  .home-title{
    margin:0;
    font-size:clamp(54px, 13vw, 104px);
    line-height:.95;
    font-weight:900;
    letter-spacing:.04em;
    background:linear-gradient(95deg, var(--navy) 10%, var(--blue) 55%, #1fb6e0 90%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 6s ease-in-out infinite alternate, popIn .7s var(--ease) both;
  }
  @keyframes shine{ from{ background-position:0% 0; } to{ background-position:100% 0; } }
  .home-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    padding:8px 18px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    color:var(--blue);
    font-weight:800;
    font-size:clamp(16px, 3.6vw, 22px);
    animation:popIn .7s .1s var(--ease) both;
  }
  .home-pill i{ width:9px; height:9px; border-radius:50%; background:var(--grad); box-shadow:0 0 0 4px rgba(56,209,245,.18); }
  .home-stage{
    position:relative;
    margin:22px 0 8px;
    display:flex;
    justify-content:center;
    animation:popIn .8s .18s var(--ease) both;
  }
  .home-stage::before{
    content:"";
    position:absolute;
    left:50%;
    top:48%;
    width:150%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(56,209,245,.28) 0%, rgba(47,111,237,.10) 38%, transparent 66%);
    z-index:-1;
  }
  .home .robot{ --rw:min(46vw, 210px); }
  .hint{
    position:relative;
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 24px;
    border-radius:999px;
    background:var(--navy);
    color:#fff;
    font-weight:800;
    font-size:clamp(15px, 3.3vw, 18px);
    box-shadow:0 12px 26px rgba(18,34,74,.25);
    animation:popIn .7s .3s var(--ease) both;
    transition:transform .25s var(--spring), background .2s;
  }
  .hint::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:inherit;
    border:2px solid rgba(47,111,237,.45);
    animation:ring 2s ease-out infinite;
  }
  @keyframes ring{ from{ transform:scale(.96); opacity:1; } to{ transform:scale(1.12); opacity:0; } }
  .home:hover .hint{ transform:translateY(-2px); background:var(--blue); }
  .hint .tap{ display:inline-block; animation:tap 1.4s ease-in-out infinite; }
  @keyframes tap{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  /* ---------- MENU ---------- */
  .menu-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    width:100%;
  }
  .bubble{
    position:relative;
    width:100%;
    max-width:440px;
    padding:22px 22px 20px;
    border-radius:26px;
    background:rgba(255,255,255,.92);
    border:2px solid var(--line);
    box-shadow:var(--shadow-lg);
    text-align:center;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    animation:popIn .45s var(--ease) both;
  }
  .bubble::after{
    content:"";
    position:absolute;
    bottom:-12px;
    left:50%;
    width:22px;
    height:22px;
    transform:translateX(-50%) rotate(45deg);
    background:#fff;
    border-right:2px solid var(--line);
    border-bottom:2px solid var(--line);
    border-bottom-right-radius:5px;
  }
  .bubble-text{
    margin:0;
    min-height:28px;
    font-size:clamp(16px, 3.4vw, 19px);
    font-weight:800;
    color:var(--navy-2);
    line-height:1.45;
  }
  .caret{ display:inline-block; width:2px; height:1.05em; margin-left:2px; vertical-align:-2px; background:var(--blue); animation:caret .8s steps(1) infinite; }
  @keyframes caret{ 50%{ opacity:0; } }
  .bubble-next{ margin:10px 0 0; font-size:12.5px; font-weight:700; color:var(--ink-3); animation:popIn .4s var(--ease) both; }
  .typing-dots{ display:inline-flex; gap:6px; align-items:center; padding:9px 0; }
  .typing-dots span{ width:9px; height:9px; border-radius:50%; background:var(--blue); animation:dots 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2){ animation-delay:.18s; }
  .typing-dots span:nth-child(3){ animation-delay:.36s; }
  @keyframes dots{ 0%,60%,100%{ opacity:.3; transform:translateY(0) scale(.8); } 30%{ opacity:1; transform:translateY(-4px) scale(1); } }
  .choices{ display:flex; flex-direction:column; gap:12px; margin-top:16px; cursor:default; }
  .choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:14px 16px;
    text-align:left;
    border-radius:18px;
    border:1px solid var(--line);
    background:var(--soft);
    cursor:pointer;
    overflow:hidden;
    animation:popIn .5s var(--ease) both;
    animation-delay:calc(var(--i,0) * 90ms + 60ms);
    transition:transform .25s var(--spring), box-shadow .2s ease, background .2s ease, color .2s ease, border-color .2s;
  }
  .choice:hover{ transform:translateY(-3px); background:var(--navy); color:#fff; border-color:var(--navy); box-shadow:0 14px 26px rgba(18,34,74,.22); }
  .choice:active{ transform:scale(.98); }
  .choice-icon{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    background:#fff;
    border:1px solid var(--line);
    position:relative;
  }
  .choice-icon b{
    position:absolute;
    right:-6px;
    bottom:-6px;
    min-width:24px;
    height:24px;
    padding:0 6px;
    border-radius:999px;
    background:var(--grad);
    color:#fff;
    font-size:13px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #fff;
  }
  .choice-text{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .choice-text small{ font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--blue); transition:color .2s; }
  .choice:hover .choice-text small{ color:var(--cyan); }
  .choice-text strong{ font-size:16px; font-weight:800; line-height:1.25; }
  .choice-meta{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; font-weight:700; opacity:.75; }

  /* ---------- UNIT ---------- */
  .page-head{

    margin:4px 0 30px;
    padding:0 64px;

  .page-title{ margin:0; font-size:clamp(26px, 5vw, 40px); line-height:1.12; font-weight:900; color:var(--navy); letter-spacing:-.01em; }

  .tiles{
    width:100%;

    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));

  }
  .tile{
    position:relative;

    transition:transform .3s var(--spring), box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s;
  }
  .entering .tile{ animation:popIn .5s var(--ease) both; animation-delay:calc(var(--i,0) * 45ms); }
  .tile::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:4px;
    background:var(--grad);
    opacity:.9;
  }
  .tile:hover{ transform:translateY(-6px); box-shadow:var(--shadow-lg); background:var(--navy); color:#fff; border-color:var(--navy); }
  .tile:active{ transform:translateY(-2px) scale(.98); }
  .tile-num{
    width:44px;

  .tile-desc{
    font-size:13.5px;

  .tile:hover .tile-desc{ color:rgba(255,255,255,.78); }
  .tile-foot{ margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; }
  .mini{
    display:inline-flex;
    align-items:center;
    gap:4px;

    border-radius:999px;
    background:var(--soft);

    font-weight:800;
    color:var(--ink-2);

  }
  .tile:hover .mini{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); color:#fff; }
  .flag{
    position:absolute;
    top:14px;
    right:14px;
    padding:4px 10px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--amber), var(--amber-2));
    color:#fff;
    font-size:11px;
    font-weight:900;
    letter-spacing:.02em;
    box-shadow:0 6px 12px rgba(245,124,35,.35);
  }
  .tile.soon{ background:rgba(255,255,255,.55); border-style:dashed; border-color:#c3d2f0; box-shadow:none; }
  .tile.soon::before{ display:none; }
  .tile.soon .tile-num{ background:#e4ecfb; color:#7d8bb0; box-shadow:none; }
  .tile.soon .tile-desc{ font-style:italic; color:var(--ink-3); }
  .tile.soon:hover{ background:var(--navy); border-style:solid; }
  .tile.soon:hover .tile-num{ background:#fff; color:var(--navy); }
  .tile.add{
    align-items:center;
    justify-content:center;

    background:transparent;
    border:2px dashed #aebfe6;
    box-shadow:none;

  .tile.add .tile-num{ background:transparent; border:2px dashed var(--blue); color:var(--blue); box-shadow:none; font-size:24px; }
  .tile.add:hover{ background:#fff; color:var(--blue); border-color:var(--blue); }
  .tile.add:hover .tile-num{ background:var(--grad); color:#fff; border-color:transparent; }

  /* ---------- SESSION ---------- */
  .s-head{
    width:100%;
    max-width:860px;
    display:flex;
    align-items:center;
    gap:18px;
    margin:0 0 22px;

  .entering .worksheet > *:nth-child(3){ animation-delay:.12s; }
  .entering .worksheet > *:nth-child(4){ animation-delay:.18s; }

  .alert{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 16px;
    border-radius:16px;

  @keyframes wiggle{ 0%,80%,100%{ transform:rotate(0); } 85%{ transform:rotate(-12deg); } 90%{ transform:rotate(10deg); } 95%{ transform:rotate(-6deg); } }
  .alert span:last-child{ margin-left:auto; font-size:13px; opacity:.8; white-space:nowrap; }

  .meta{
    position:relative;
    overflow:hidden;
    padding:24px 26px;
    border-radius:var(--radius);
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 60%, #23408a 100%);
    color:#fff;
    box-shadow:var(--shadow-lg);
  }
  .meta::after{
    content:"";
    position:absolute;
    right:-70px;
    top:-70px;

    height:220px;

    pointer-events:none;
  }
  .label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.14);
    font-size:12px;
    font-weight:900;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .meta-text{ position:relative; margin:12px 0 18px; font-size:clamp(17px, 2.8vw, 21px); font-weight:800; line-height:1.45; white-space:pre-line; }
  .crit-label{ margin:0 0 10px; font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:#a9bbeb; }
  .chips{ position:relative; display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 14px 7px 8px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    font-size:14px;
    font-weight:800;
  }
  .chip .ck{ width:20px; height:20px; border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .chip-x, .chip-add{
    border:none;
    cursor:pointer;
    border-radius:999px;
    font-weight:900;
  }
  .chip-x{ width:22px; height:22px; margin-left:2px; background:rgba(255,255,255,.18); color:#fff; font-size:12px; line-height:1; }
  .chip-x:hover{ background:#e74c3c; }
  .chip-add{ padding:7px 14px; background:transparent; color:#cfe0ff; border:1.5px dashed rgba(255,255,255,.45); font-size:13px; }
  .chip-add:hover{ background:rgba(255,255,255,.12); color:#fff; }

  .sec-title{ display:flex; align-items:center; gap:10px; margin:6px 2px -4px; font-size:13px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
  .sec-title::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent); }
  .acts{ position:relative; display:flex; flex-direction:column; gap:16px; }
  .acts::before{
    content:"";
    position:absolute;
    left:36px;
    top:40px;
    bottom:40px;
    width:3px;
    border-radius:3px;
    background:linear-gradient(var(--blue), var(--cyan));
    opacity:.25;
  }
  .act{
    position:relative;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:18px;
    padding:20px 22px 20px 16px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card);
    box-shadow:var(--shadow);
    transition:transform .3s var(--spring), box-shadow .25s;
  }
  .act:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); }
  .act-step{
    position:relative;
    z-index:1;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--grad);
    color:#fff;
    font-weight:900;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 6px #fff, 0 8px 18px rgba(47,111,237,.3);
  }
  .act-main{ min-width:0; }
  .act-top{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .act-label{ font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--blue); }
  .act h3{ margin:0 0 6px; font-size:clamp(17px, 2.6vw, 20px); font-weight:900; line-height:1.3; color:var(--navy); }
  .act-desc{ margin:0; font-size:14.5px; font-weight:600; line-height:1.55; color:var(--ink-2); white-space:pre-line; }
  .mode{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 10px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:900;
    letter-spacing:.02em;
  }
  .mode.individual{ background:var(--green-bg); color:var(--green); }
  .mode.group{ background:var(--violet-bg); color:var(--violet); }
  select.mode{ border:1px solid var(--line); cursor:pointer; font-family:inherit; padding:4px 8px; }
  .act-x{
    border:none;
    background:#fdeceb;
    color:var(--red);
    font-weight:900;
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
    cursor:pointer;
  }
  .act-x:hover{ background:var(--red); color:#fff; }

  .file{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    min-width:190px;
    padding:14px;
    border-radius:18px;
    background:var(--soft);
    border:1px solid var(--line);
    transition:border-color .2s, background .2s;
  }
  .file.drag{ border:2px dashed var(--blue); background:#e8f0ff; }
  .file-head{ display:flex; align-items:center; gap:10px; }
  .file-ico{
    width:36px;
    height:42px;
    flex-shrink:0;
    border-radius:8px 14px 8px 8px;
    background:linear-gradient(160deg,#ffffff,#e9f0ff);
    border:1px solid var(--line);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:5px;
    font-size:9px;
    font-weight:900;
    color:#fff;
    position:relative;
  }
  .file-ico::after{ content:attr(data-ext); background:var(--red); padding:1px 5px; border-radius:4px; }
  .file-ico[data-ext="IMG"]::after{ background:var(--green); }
  .file-ico[data-ext="DOC"]::after, .file-ico[data-ext="PPT"]::after{ background:var(--blue); }
  .file-ico.none::after{ background:#aab6d3; }
  .file-name{ display:flex; flex-direction:column; min-width:0; }
  .ficha-badge{ font-size:13.5px; font-weight:900; color:var(--navy); line-height:1.25; }
  .file-sub{ font-size:11.5px; font-weight:700; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px; }
  .file-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px 14px;
    border-radius:12px;
    border:1px solid transparent;
    font-size:13.5px;
    font-weight:800;
    line-height:1;
    text-decoration:none;
    white-space:nowrap;
    cursor:pointer;
    flex:1;
    transition:transform .25s var(--spring), box-shadow .2s, background .2s, color .2s;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn:active{ transform:scale(.96); }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .btn.ghost{ background:#fff; color:var(--blue); border-color:var(--line); }
  .btn.ghost:hover{ box-shadow:0 8px 16px rgba(47,111,237,.16); }
  .btn.solid{ background:var(--grad); color:#fff; box-shadow:0 8px 16px rgba(47,111,237,.25); }
  .btn.solid:hover{ box-shadow:0 12px 22px rgba(47,111,237,.35); }
  .btn.up{ background:var(--violet-bg); color:var(--violet); }
  .btn.del{ background:#fdeceb; color:var(--red); flex:none; }
  .btn.amber{ background:linear-gradient(135deg, var(--amber), var(--amber-2)); color:#fff; box-shadow:0 8px 16px rgba(245,124,35,.28); }
  .btn.amber-ghost{ background:#fff; color:#a86a10; border-color:#f0d5a0; }
  .file-missing{ font-size:12.5px; font-weight:700; font-style:italic; color:var(--ink-3); }
  .drop-hint{ font-size:11px; font-weight:700; color:var(--ink-3); text-align:center; }

  .flipped{
    position:relative;
    overflow:hidden;
    padding:24px 24px 22px;
    border-radius:var(--radius);
    border:1px solid #f0d5a0;
    background:linear-gradient(135deg,#fff6e3 0%,#ffe8c2 100%);
    box-shadow:0 16px 34px rgba(170,110,20,.16);
    scroll-margin-top:90px;
  }
  .flipped::after{
    content:"";
    position:absolute;
    right:-60px;
    bottom:-60px;
    width:220px;
    height:220px;
    border-radius:50%;
    border:26px solid rgba(245,166,35,.12);
    pointer-events:none;
  }
  .flipped.flash{ animation:flash 1.2s ease; }
  @keyframes flash{ 0%,100%{ box-shadow:0 16px 34px rgba(170,110,20,.16); } 30%{ box-shadow:0 0 0 6px rgba(245,166,35,.45), 0 16px 34px rgba(170,110,20,.2); } }
  .flipped-top{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .flip-badge{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:linear-gradient(135deg, var(--amber), var(--amber-2)); color:#fff; font-size:12px; font-weight:900; letter-spacing:.08em; }
  .flip-when{ font-size:12.5px; font-weight:800; color:#a86a10; }
  .flipped h3{ margin:12px 0 8px; font-size:clamp(18px, 2.8vw, 21px); font-weight:900; color:#7a4a12; }
  .flipped .desc{ margin:0 0 16px; font-weight:600; line-height:1.6; color:#8a6326; white-space:pre-line; }
  .flipped .file{ background:rgba(255,255,255,.6); border-color:#f0d5a0; max-width:420px; }
  .toggle{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-radius:16px;
    border:1.5px dashed #e5c887;
    background:#fffaf0;
    font-weight:800;
    font-size:14px;
    color:#7a4a12;
    cursor:pointer;
  }
  .toggle input{ width:20px; height:20px; accent-color:var(--amber-2); }

  .pager{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  .pager-btn{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:14px 18px;
    border-radius:18px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.75);
    cursor:pointer;
    text-align:left;
    transition:transform .25s var(--spring), box-shadow .2s, background .2s;
  }
  .pager-btn:hover{ transform:translateY(-3px); background:#fff; box-shadow:var(--shadow); }
  .pager-btn small{ font-size:11.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
  .pager-btn strong{ font-size:16px; font-weight:900; color:var(--navy); }
  .pager-btn.next{ text-align:right; grid-column:2; }

  .empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding:10px 0 20px;
  }
  .empty .bubble{ cursor:default; max-width:420px; }
  .empty .robot{ --rw:130px; }

  .danger-zone{ display:flex; justify-content:center; padding-top:6px; }
  .add-act{
    width:100%;
    padding:16px;
    border-radius:var(--radius);
    border:2px dashed #aebfe6;
    background:rgba(255,255,255,.5);
    color:var(--blue);
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .add-act:hover{ background:#fff; border-color:var(--blue); }

  /* ---------- Editable fields ---------- */
  body.editing [data-bind]{
    outline:1.5px dashed #9db3e6;
    outline-offset:3px;
    border-radius:6px;
    cursor:text;
    min-width:40px;
  }
  body.editing .meta [data-bind], body.editing .chip [data-bind]{ outline-color:rgba(255,255,255,.5); }
  body.editing [data-bind]:focus{ outline:2px solid var(--blue); background:rgba(47,111,237,.06); }
  body.editing .meta [data-bind]:focus{ outline-color:var(--cyan); background:rgba(255,255,255,.08); }
  [data-bind]:empty::before{ content:attr(data-ph); color:#9aa8c9; font-style:italic; font-weight:600; }
  .meta [data-bind]:empty::before, .chip [data-bind]:empty::before{ color:rgba(255,255,255,.5); }

  /* ---------- Edit dock ---------- */
  .dock{
    position:fixed;
    left:50%;
    bottom:calc(16px + var(--safe-b));
    transform:translateX(-50%);
    z-index:90;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px 8px 16px;
    border-radius:999px;
    background:rgba(18,34,74,.94);
    color:#fff;
    box-shadow:0 18px 40px rgba(18,34,74,.4);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    animation:dockIn .45s var(--spring) both;
    max-width:calc(100vw - 24px);
  }
  @keyframes dockIn{ from{ opacity:0; transform:translate(-50%, 30px) scale(.9); } to{ opacity:1; transform:translate(-50%, 0); } }
  .dock-status{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; white-space:nowrap; }
  .dock-status i{ width:9px; height:9px; border-radius:50%; background:#2ecc71; box-shadow:0 0 0 4px rgba(46,204,113,.2); }
  .dock.dirty .dock-status i{ background:var(--amber); box-shadow:0 0 0 4px rgba(245,166,35,.25); }
  .dock-btn{
    border:none;
    border-radius:999px;
    padding:10px 16px;
    font-weight:900;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .25s var(--spring), background .2s;
  }

<script>
(() => {
  'use strict';
  const PAGE_SNAPSHOT = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DRAFT_KEY = 'ciencia4b:draft:' + APP.docId;

  /* ================= Data helpers ================= */
  const unitByKey = k => APP.units.find(u => u.key === k);
  const blankSession = () => ({
    title: '', meta: '', criteria: ['', '', ''],
    flipped: { enabled: false, title: '', desc: '', file: '' },
    activities: [
      { mode: 'individual', title: '', desc: '', ficha: 'Ficha · Actividad 01', file: '' },
      { mode: 'group', title: '', desc: '', ficha: 'Ficha · Actividad 02', file: '' }
    ],
    ticket: { questions: [] }
  });
  const normalize = () => APP.units.forEach(u => u.sessions.forEach(s => { if(!s.ticket) s.ticket = { questions: [] }; }));
  normalize();
  const filled = s => !!(s && String(s).trim());
  function isEmptySession(s){
    return !filled(s.title) && !filled(s.meta) && !s.criteria.some(filled) && !s.flipped.enabled &&
      !s.activities.some(a => filled(a.title) || filled(a.desc) || a.file) && !s.ticket.questions.length;
  }
  const readyCount = u => u.sessions.filter(s => !isEmptySession(s)).length;
  function fileKind(f){
    const t = (f && f.type) || '', n = ((f && f.name) || '').toLowerCase();
    if(t === 'application/pdf' || n.endsWith('.pdf')) return 'PDF';
    if(t.startsWith('image/')) return 'IMG';
    if(/\.(pptx?|key)$/.test(n)) return 'PPT';
    return 'DOC';
  }

  /* ================= Robot ================= */
  let robotSeq = 0;
  function robotHTML(){
    const d = (robotSeq++ * 1.3 % 5).toFixed(1);
    return `<div class="robot" role="img" aria-label="Robot" style="--blink-delay:${d}s">
      <div class="robot-hop"><div class="robot-bob"><div class="robot-body"><div class="robot-eyes"><i class="eye l" style="--blink:${d}s"></i><i class="eye r" style="--blink:${d}s"></i></div></div></div></div>
      <span class="robot-shadow"></span></div>`;
  }
  $$('[data-robot-slot]').forEach(s => { s.innerHTML = robotHTML(); });

  let lookX = null, lookY = null, lookQueued = false, lastMove = 0;
  function applyLook(){
    lookQueued = false;
    $$('.screen.active .robot, dialog[open] .robot').forEach(r => {
      const eyes = r.querySelector('.robot-eyes');
      if(lookX == null){ eyes.style.transform = ''; return; }
      const b = r.querySelector('.robot-body').getBoundingClientRect();
      if(!b.width) return;
      const dx = lookX - (b.left + b.width * .45), dy = lookY - (b.top + b.height * .26);
      const k = Math.min(1, Math.hypot(dx, dy) / 260), a = Math.atan2(dy, dx);
      eyes.style.transform = `translate(${(Math.cos(a) * b.width * .035 * k).toFixed(2)}px, ${(Math.sin(a) * b.width * .028 * k).toFixed(2)}px)`;
    });
  }
  function look(x, y){ lookX = x; lookY = y; lastMove = Date.now(); if(!lookQueued){ lookQueued = true; requestAnimationFrame(applyLook); } }
  addEventListener('pointermove', e => look(e.clientX, e.clientY), { passive:true });
  addEventListener('pointerdown', e => look(e.clientX, e.clientY), { passive:true });
  document.addEventListener('mouseleave', () => { lookX = null; applyLook(); });
  if(!reduceMotion) setInterval(() => {
    if(Date.now() - lastMove < 3500 || document.hidden) return;
    const r = $('.screen.active .robot .robot-body');
    if(!r) return;
    const b = r.getBoundingClientRect();
    if(Math.random() < .35){ lookX = null; applyLook(); return; }
    lookX = b.left + b.width * (Math.random() * 3 - 1); lookY = b.top + b.height * (Math.random() * 1.6 - .3);
    applyLook();
  }, 2600);

  function react(robot){
    robot.classList.remove('hop');
    void robot.offsetWidth;
    robot.classList.add('hop', 'happy');
    clearTimeout(robot._t);
    robot._t = setTimeout(() => robot.classList.remove('hop', 'happy'), 1100);
  }

  /* ================= Secret gesture: 10 taps on a robot in 4 s ================= */
  let taps = 0, tapTimer = null;
  document.addEventListener('click', e => {
    const robot = e.target.closest('.robot');
    if(!robot) return;
    react(robot);
    if(editing) return;
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 4000);
    if(taps >= 10){ taps = 0; enterEdit(); }
  });

  /* ================= Routing ================= */
  const screens = { home: $('#screen-home'), menu: $('#screen-menu'), unit: $('#screen-unit'), session: $('#screen-session') };
  let route = { name: 'home' };
  const trail = [];
  function parse(hash){
    const p = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    if(p[0] === 'menu') return { name:'menu' };
    if(p[0] === 'u' && unitByKey(p[1])){
      const u = unitByKey(p[1]);
      if(p[2] === 's'){ const n = +p[3]; if(n >= 1 && n <= u.sessions.length) return { name:'session', unit:p[1], n }; }
      return { name:'unit', unit:p[1] };
    }
    return { name:'home' };
  }
  const toHash = r => r.name === 'home' ? '#/' : r.name === 'menu' ? '#/menu' : r.name === 'unit' ? `#/u/${r.unit}` : `#/u/${r.unit}/s/${r.n}`;
  const depth = r => ({ home:0, menu:1, unit:2, session:3 })[r.name];
  const parentOf = r => r.name === 'session' ? { name:'unit', unit:r.unit } : r.name === 'unit' ? { name:'menu' } : { name:'home' };

  function go(r, { replace = false } = {}){
    const h = toHash(r);
    if(replace){ history.replaceState(null, '', h); trail[trail.length - 1] = h; render(r, 'side'); }
    else if(location.hash !== h) location.hash = h;
  }
  function goBack(){
    if(route.name === 'home') return;
    const parent = toHash(parentOf(route));
    if(trail.length > 1 && trail[trail.length - 2] === parent) history.back();
    else go(parentOf(route));
  }
  addEventListener('hashchange', () => {
    const h = toHash(parse(location.hash));
    if(trail.length > 1 && trail[trail.length - 2] === h) trail.pop(); else trail.push(h);
    const r = parse(location.hash);
    render(r, depth(r) >= depth(route) ? 'fwd' : 'back');
  });

  function render(r, dir){
    commitFocused();
    const prev = route;
    route = r;
    Object.entries(screens).forEach(([k, el]) => {
      const on = k === r.name;
      el.classList.toggle('active', on);
      el.classList.remove('anim-fwd', 'anim-back', 'anim-side', 'entering');
      clearTimeout(el._animT);
      if(on && dir && !reduceMotion){
        void el.offsetWidth;
        el.classList.add('anim-' + dir, 'entering');
        el._animT = setTimeout(() => el.classList.remove('anim-' + dir, 'entering'), 1100);
      }
    });
    $('#backBtn').hidden = r.name === 'home';
    if(r.name === 'menu') startMenu(prev.name === 'home');
    else stopMenu();
    if(r.name === 'unit') renderUnit();
    if(r.name === 'session') renderSession();
    document.title = r.name === 'session' ? `Sesión ${r.n} · Unidad ${unitByKey(r.unit).num} · Ciencia`
      : r.name === 'unit' ? `Unidad ${unitByKey(r.unit).num} · Ciencia` : 'Ciencia · 4to Bimestre';
    if(dir !== undefined) window.scrollTo(0, 0);
    applyLook();
  }

  $('#homeTap').addEventListener('click', () => go({ name:'menu' }));
  $('#homeTap').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go({ name:'menu' }); } });
  $('#backBtn').addEventListener('click', goBack);
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if(!g || e.target.closest('[data-bind]') || e.target.closest('.no-go')) return;
    e.preventDefault();
    const r = parse(g.dataset.go);
    go(r, { replace: g.dataset.replace === '1' });
  });
  document.addEventListener('keydown', e => {
    if(document.querySelector('dialog[open]')) return;
    const typing = e.target.closest && e.target.closest('[data-bind], input, select, textarea');
    if(typing) return;
    if(e.key === 'Escape'){ if(route.name !== 'home'){ e.preventDefault(); goBack(); } }
    else if(route.name === 'session' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      const u = unitByKey(route.unit), n = route.n + (e.key === 'ArrowRight' ? 1 : -1);
      if(n >= 1 && n <= u.sessions.length) go({ name:'session', unit:route.unit, n }, { replace:true });
    }
  });

  /* ================= Menu: staged speech bubble ================= */
  const menuText = $('#menuText'), menuNext = $('#menuNext'), menuChoices = $('#menuChoices');
  const GREETING = '¡Hola, estimado(a) estudiante! ¿Cómo estás? El día de hoy, ¿qué unidad deseas aprender?';
  let stage = 0, typing = null, stageTimer = null;
  const menuRobot = () => $('#menuRobot .robot');

  function typeText(text, done){
    stopTyping();
    const robot = menuRobot();
    if(reduceMotion){ menuText.textContent = text; done && done(); return; }
    let i = 0;
    robot && robot.classList.add('talking');
    menuText.innerHTML = '<span></span><i class="caret"></i>';
    const span = menuText.firstChild;
    typing = { text, done, id: setInterval(() => {
      i += text[i] === ' ' ? 2 : 1;
      span.textContent = text.slice(0, i);
      if(i >= text.length) finishTyping();
    }, 24) };
  }
  function stopTyping(){ if(typing){ clearInterval(typing.id); typing = null; } const r = menuRobot(); r && r.classList.remove('talking'); }
  function finishTyping(){
    if(!typing) return false;
    const { text, done } = typing;
    stopTyping();
    menuText.textContent = text;
    done && done();
    return true;
  }
  function setStage(s){
    stage = s;
    clearTimeout(stageTimer);
    menuNext.hidden = true;
    if(s === 0){
      stopTyping();
      menuChoices.hidden = true;
      menuText.innerHTML = '<span class="typing-dots" aria-label="Escribiendo"><span></span><span></span><span></span></span>';
      stageTimer = setTimeout(() => setStage(1), 900);
    } else if(s === 1){
      menuChoices.hidden = true;
      typeText(GREETING, () => { menuNext.hidden = false; stageTimer = setTimeout(() => setStage(2), 2600); });
    } else {
      renderChoices();
      typeText('¡Elige una unidad! 🤖', () => { menuChoices.hidden = false; });
    }
  }
  function startMenu(fresh){
    if(fresh || stage < 2) setStage(0);
    else { stopTyping(); clearTimeout(stageTimer); renderChoices(); menuText.textContent = '¡Elige una unidad! 🤖'; menuNext.hidden = true; menuChoices.hidden = false; }
  }
  function stopMenu(){ stopTyping(); clearTimeout(stageTimer); }
  function advance(){
    if(finishTyping()) return;
    if(stage < 2) setStage(stage + 1);
  }
  $('#menuBubble').addEventListener('click', e => { if(!e.target.closest('.choices')) advance(); });
  $('#menuRobot').addEventListener('click', advance);

  function renderChoices(){
    menuChoices.innerHTML = APP.units.map((u, i) => {
      const n = readyCount(u), t = u.sessions.length;
      return `<button class="choice" type="button" style="--i:${i}" data-go="#/u/${u.key}">
        <span class="choice-icon">${esc(u.icon || '📘')}<b>${esc(u.num)}</b></span>
        <span class="choice-text"><small>Unidad ${esc(u.num)}</small><strong>${esc(u.title)}</strong>
          <span class="choice-meta"><span class="bar"><i style="width:${t ? Math.round(n / t * 100) : 0}%"></i></span>${n} de ${t} sesiones listas</span></span>
        <span class="choice-arrow">›</span></button>`;
    }).join('');
  }

  /* ================= Unit screen ================= */
  function renderUnit(){
    const u = unitByKey(route.unit), n = readyCount(u), t = u.sessions.length;
    const ed = editable();
    const tiles = u.sessions.map((s, i) => {
      const empty = isEmptySession(s);
      const desc = empty ? 'Próximamente' : [s.title, s.meta, ...s.activities.map(x => x.title), s.flipped.title].find(filled) || 'Ver sesión';
      const acts = s.activities.filter(a => filled(a.title) || a.file).length;
      return `<button type="button" class="tile${empty ? ' soon' : ''}" style="--i:${i}" data-go="#/u/${u.key}/s/${i + 1}" aria-label="Sesión ${i + 1}${empty ? ', próximamente' : ''}">
        ${s.flipped.enabled ? '<span class="flag">🔄 Flipped</span>' : ''}
        <span class="tile-num">${i + 1}</span>
        <span class="tile-name">Sesión ${i + 1}</span>
        <span class="tile-desc">${esc(desc)}</span>
        ${!empty && acts ? `<span class="tile-foot"><span class="mini">📝 ${acts} ${acts === 1 ? 'actividad' : 'actividades'}</span></span>` : ''}
      </button>`;
    }).join('') + (editing ? `<button type="button" class="tile add" id="addSession" style="--i:${t}"><span class="tile-num">+</span><span class="tile-name">Añadir sesión</span></button>` : '');
    screens.unit.innerHTML = `
      <header class="page-head">
        <span class="kicker"><span ${ed} data-bind="u.icon" data-single data-ph="🔬">${esc(u.icon)}</span> Unidad ${esc(u.num)}</span>
        <h1 class="page-title" ${ed} data-bind="u.title" data-single data-ph="Título de la unidad">${esc(u.title)}</h1>
        <p class="page-sub"><span class="bar"><i style="width:${t ? Math.round(n / t * 100) : 0}%"></i></span><span>${n} de ${t} sesiones disponibles</span></p>
      </header>
      <div class="tiles">${tiles}</div>`;
    const add = $('#addSession');
    if(add) add.addEventListener('click', () => {
      u.sessions.push(blankSession());
      changed();
      go({ name:'session', unit:u.key, n:u.sessions.length });
    });
  }

  /* ================= Session screen ================= */
  const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>';

  function editable(){ return editing ? (supportsPlain ? 'contenteditable="plaintext-only"' : 'contenteditable="true"') : ''; }
  const supportsPlain = (() => { const d = document.createElement('div'); try{ d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; }catch(e){ return false; } })();

  function fileBox(obj, slot, label, amber){
    const f = obj.file && APP.files[obj.file];
    const kind = f ? fileKind(f) : '';
    const ed = editable();
    let actions = '';
    if(f){
      actions += `<button type="button" class="btn ${amber ? 'amber-ghost' : 'ghost'}" data-view="${slot}">${ICON_EYE} Ver ficha</button>`;
      actions += `<button type="button" class="btn ${amber ? 'amber' : 'solid'}" data-dl="${slot}">${ICON_DL} Descargar</button>`;
    }
    if(editing){
      actions += `<button type="button" class="btn up" data-up="${slot}">📤 ${f ? 'Reemplazar' : 'Subir archivo'}</button>`;
      if(f) actions += `<button type="button" class="btn del" data-rm="${slot}" aria-label="Quitar archivo">🗑</button>`;
    }
    const labelHtml = label != null
      ? `<span class="ficha-badge" ${ed} data-bind="${label}" data-single data-ph="Nombre de la ficha">${esc(resolve(label)[0][resolve(label)[1]])}</span>`
      : `<span class="ficha-badge">Ficha de la tarea</span>`;
    return `<div class="file" data-drop="${slot}">
      <div class="file-head"><span class="file-ico${f ? '' : ' none'}" data-ext="${f ? kind : '—'}"></span>
        <span class="file-name">${labelHtml}<span class="file-sub">${f ? esc(f.name) : 'Sin ficha todavía'}</span></span></div>
      ${actions ? `<div class="file-actions">${actions}</div>` : ''}
      ${editing ? '<div class="drop-hint">o arrastra aquí un PDF, imagen o Word</div>' : ''}
    </div>`;
  }

  function renderSession(){
    const u = unitByKey(route.unit), s = u.sessions[route.n - 1], n = route.n, total = u.sessions.length;
    const ed = editable();
    const empty = isEmptySession(s) && !editing;
    const head = `
      <header class="s-head">
        ${empty ? '' : robotHTML()}
        <div class="s-head-text">
          <button type="button" class="kicker" data-go="#/u/${u.key}">${esc(u.icon)} Unidad ${esc(u.num)}<span class="k-long"> · ${esc(u.title)}</span></button>
          <h1 class="page-title">Sesión ${n}</h1>
          ${(filled(s.title) || editing) ? `<p class="s-subtitle" ${ed} data-bind="s.title" data-single data-ph="Título de la sesión (opcional)">${esc(s.title)}</p>` : ''}
        </div>
      </header>`;
    const pager = `<nav class="pager" aria-label="Otras sesiones">
        ${n > 1 ? `<button type="button" class="pager-btn" data-go="#/u/${u.key}/s/${n - 1}" data-replace="1"><small>‹ Anterior</small><strong>Sesión ${n - 1}</strong></button>` : ''}
        ${n < total ? `<button type="button" class="pager-btn next" data-go="#/u/${u.key}/s/${n + 1}" data-replace="1"><small>Siguiente ›</small><strong>Sesión ${n + 1}</strong></button>` : ''}
      </nav>`;

    if(empty){
      screens.session.innerHTML = head + `
        <div class="worksheet"><div class="empty">
          <div class="bubble"><p class="bubble-text">¡Esta sesión llegará muy pronto! 🚀<br><span style="font-weight:700;color:var(--ink-2);font-size:15px">Mientras tanto, repasa las sesiones anteriores.</span></p></div>
          ${robotHTML()}
        </div>${pager}</div>`;
      return;
    }

    const crit = s.criteria.map((c, i) => (editing || filled(c)) ? `<span class="chip"><span class="ck">✓</span><span ${ed} data-bind="s.criteria.${i}" data-single data-ph="Criterio ${i + 1}">${esc(c)}</span>${editing ? `<button type="button" class="chip-x" data-crit-rm="${i}" aria-label="Quitar criterio">✕</button>` : ''}</span>` : '').join('');
    const showCrit = editing || s.criteria.some(filled);

    const acts = s.activities.map((a, i) => {
      const mode = editing
        ? `<select class="mode ${a.mode}" data-mode="${i}" aria-label="Modalidad"><option value="individual"${a.mode !== 'group' ? ' selected' : ''}>👤 Individual</option><option value="group"${a.mode === 'group' ? ' selected' : ''}>👥 Colaborativo</option></select>`
        : `<span class="mode ${a.mode}">${a.mode === 'group' ? '👥 Colaborativo' : '👤 Individual'}</span>`;
      return `<article class="act">
        <span class="act-step">${i + 1}</span>
        <div class="act-main">
          <div class="act-top"><span class="act-label">Actividad ${i + 1}</span>${mode}${editing ? `<button type="button" class="act-x" data-act-rm="${i}">✕ Quitar</button>` : ''}</div>
          ${(editing || filled(a.title)) ? `<h3 ${ed} data-bind="s.activities.${i}.title" data-single data-ph="Título de la actividad ${i + 1}">${esc(a.title)}</h3>` : ''}
          ${(editing || filled(a.desc)) ? `<p class="act-desc" ${ed} data-bind="s.activities.${i}.desc" data-ph="Breve descripción (1-2 líneas) de lo que se hace en esta actividad…">${esc(a.desc)}</p>` : ''}
        </div>
        ${fileBox(a, 'a' + i, `s.activities.${i}.ficha`)}
      </article>`;
    }).join('');

    const f = s.flipped;
    const flipped = (f.enabled ? `
      <section class="flipped" id="flippedCard">
        <div class="flipped-top"><span class="flip-badge">🔄 FLIPPED</span><span class="flip-when">📌 Tarea para antes de la clase</span></div>
        ${(editing || filled(f.title)) ? `<h3 ${ed} data-bind="s.flipped.title" data-single data-ph="Título de la tarea Flipped">${esc(f.title)}</h3>` : ''}
        ${(editing || filled(f.desc)) ? `<p class="desc" ${ed} data-bind="s.flipped.desc" data-ph="Describe brevemente la tarea que deben hacer antes de la clase…">${esc(f.desc)}</p>` : ''}
        ${fileBox(f, 'fl', null, true)}
      </section>` : '') + (editing ? `<label class="toggle"><input type="checkbox" id="flipToggle"${f.enabled ? ' checked' : ''}> Esta sesión tiene tarea Flipped (para antes de la clase)</label>` : '');

    screens.session.innerHTML = head + `
      <div class="worksheet">
        ${f.enabled && !editing ? `<button type="button" class="alert" id="flipAlert"><span class="alert-ico">🔄</span><span>Esta sesión tiene tarea Flipped para antes de la clase</span><span>Ver tarea ↓</span></button>` : ''}
        <section class="meta">
          <span class="label">🎯 Meta</span>
          <p class="meta-text" ${ed} data-bind="s.meta" data-ph="Escribe aquí la meta de la sesión…">${esc(s.meta)}</p>
          ${showCrit ? `<p class="crit-label">Criterios de éxito</p><div class="chips">${crit}${editing ? '<button type="button" class="chip-add" id="critAdd">+ Criterio</button>' : ''}</div>` : ''}
        </section>
        ${s.activities.length || editing ? '<div class="sec-title">Actividades</div>' : ''}
        <div class="acts">${acts}</div>
        ${editing ? '<button type="button" class="add-act" id="actAdd">+ Añadir actividad</button>' : ''}
        ${flipped}
        ${ticketHtml(s)}
        ${pager}
        ${editing ? '<div class="danger-zone"><button type="button" class="btn del" id="sessionRm">🗑 Eliminar esta sesión</button></div>' : ''}
      </div>`;
  }

  function ticketHtml(s){
    const qs = s.ticket.questions, ready = playable(s).length;
    if(!editing){
      return ready ? `<button type="button" class="tk-cta" id="tkOpen"><span class="tk-cta-ico">🎟️</span>
        <span class="tk-cta-text"><strong>Exit ticket</strong><span>Responde ${ready} preguntas sobre lo que aprendiste hoy</span></span>
        <span class="tk-cta-go">¡Empezar!</span></button>` : '';
    }
    const ed = editable();
    return `<div class="sec-title">Exit ticket</div>
      <div class="tk-edit">
        ${qs.map((q, i) => `<div class="tq">
          <div class="tq-top"><span class="q-num">Pregunta ${i + 1}</span><button type="button" class="tq-mini rm" data-tq-rm="${i}">✕ Quitar</button></div>
          <h4 ${ed} data-bind="s.ticket.questions.${i}.q" data-single data-ph="Escribe la pregunta…">${esc(q.q)}</h4>
          ${q.options.map((o, j) => `<div class="tq-opt"><input type="radio" name="tqa${i}" data-tq-ans="${i}.${j}"${q.answer === j ? ' checked' : ''} title="Respuesta correcta" aria-label="Respuesta correcta"><span ${ed} data-bind="s.ticket.questions.${i}.options.${j}" data-single data-ph="Opción ${LETTERS[j]}">${esc(o)}</span>${q.options.length > 2 ? `<button type="button" class="tq-mini rm" data-tq-orm="${i}.${j}" aria-label="Quitar opción">✕</button>` : ''}</div>`).join('')}
          ${q.options.length < 4 ? `<button type="button" class="tq-mini" data-tq-oadd="${i}">+ Opción</button>` : ''}
          <p class="tq-why" ${ed} data-bind="s.ticket.questions.${i}.why" data-single data-ph="Explicación corta que verá el estudiante (opcional)">${esc(q.why || '')}</p>
        </div>`).join('')}
        <div class="tk-tools">
          <button type="button" class="btn ghost" id="tqAdd">+ Añadir pregunta</button>
          ${ready ? '<button type="button" class="btn up" id="tkOpen">▶ Probar exit ticket</button>' : ''}
          <button type="button" class="btn ghost" id="tkRes">📊 Resultados por sección</button>
        </div>
        <p class="drop-hint" style="text-align:left">🟢 Marca el círculo de la respuesta correcta de cada pregunta.</p>
      </div>`;
  }

  const curUnit = () => unitByKey(route.unit);
  const curSession = () => curUnit().sessions[route.n - 1];
  function slotObj(slot){
    const s = curSession();
    return slot === 'fl' ? s.flipped : s.activities[+slot.slice(1)];
  }
  function resolve(path){
    const parts = path.split('.');
    let obj = parts[0] === 'u' ? curUnit() : curSession();
    for(let i = 1; i < parts.length - 1; i++) obj = obj[isNaN(parts[i]) ? parts[i] : +parts[i]];
    const last = parts[parts.length - 1];
    return [obj, isNaN(last) ? last : +last];
  }

  /* ================= Files: view / download ================= */
  const blobCache = new Map();
  function blobUrl(id){
    if(blobCache.has(id)) return blobCache.get(id);
    const f = APP.files[id];
    const bin = atob(f.b64), bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: f.type || 'application/octet-stream' }));
    blobCache.set(id, url);
    return url;
  }
  function download(url, name){
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  const bigScreen = () => matchMedia('(min-width: 820px) and (pointer: fine)').matches;
  const viewer = $('#viewer');
  let viewerFile = null;
  function view(id){
    const f = APP.files[id], kind = fileKind(f), url = blobUrl(id);
    if(kind === 'DOC' || kind === 'PPT'){ download(url, f.name); toast('📥 Este tipo de archivo se descarga para abrirlo en tu equipo.'); return; }
    if(kind === 'PDF' && !bigScreen()){ window.open(url, '_blank', 'noopener'); return; }
    viewerFile = id;
    $('#viewerTitle').textContent = f.name;
    $('#viewerTab').href = url;
    $('#viewerBody').innerHTML = kind === 'IMG' ? `<img src="${url}" alt="${esc(f.name)}">` : `<iframe src="${url}" title="${esc(f.name)}"></iframe>`;
    viewer.showModal();
  }
  $('#viewerClose').addEventListener('click', () => viewer.close());
  viewer.addEventListener('click', e => { if(e.target === viewer) viewer.close(); });
  viewer.addEventListener('close', () => { $('#viewerBody').innerHTML = ''; });
  $('#viewerDl').addEventListener('click', () => { const f = APP.files[viewerFile]; download(blobUrl(viewerFile), f.name); });

  /* ================= Session interactions ================= */
  screens.session.addEventListener('click', e => {
    const t = e.target;
    const v = t.closest('[data-view]'), d = t.closest('[data-dl]');
    if(v){ view(slotObj(v.dataset.view).file); return; }
    if(d){ const id = slotObj(d.dataset.dl).file; download(blobUrl(id), APP.files[id].name); toast('⬇️ Descargando ' + APP.files[id].name); return; }
    if(t.closest('#flipAlert')){
      const c = $('#flippedCard');
      c.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'center' });
      c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
      return;
    }
    if(t.closest('#tkOpen')){ commitFocused(); openTicket(route.unit, route.n, editing); return; }
    if(!editing) return;
    const s = curSession();
    if(t.closest('#tkRes')){ openResults(); return; }
    if(t.closest('#tqAdd')){ commitFocused(); s.ticket.questions.push({ q:'', options:['', '', ''], answer:0, why:'' }); changed(); renderSession(); focusLast('.tq h4[data-bind]'); return; }
    const tqr = t.closest('[data-tq-rm]');
    if(tqr){
      const i = +tqr.dataset.tqRm;
      if(filled(s.ticket.questions[i].q) && !confirm(`¿Quitar la pregunta ${i + 1}?`)) return;
      commitFocused(); s.ticket.questions.splice(i, 1); changed(); renderSession(); return;
    }
    const orm = t.closest('[data-tq-orm]');
    if(orm){
      const [i, j] = orm.dataset.tqOrm.split('.').map(Number), q = s.ticket.questions[i];
      commitFocused(); q.options.splice(j, 1);
      if(q.answer === j) q.answer = 0; else if(q.answer > j) q.answer--;
      changed(); renderSession(); return;
    }
    const oadd = t.closest('[data-tq-oadd]');
    if(oadd){ commitFocused(); s.ticket.questions[+oadd.dataset.tqOadd].options.push(''); changed(); renderSession(); return; }
    const up = t.closest('[data-up]'), rm = t.closest('[data-rm]');
    if(up){ pickFile(up.dataset.up); return; }
    if(rm){ slotObj(rm.dataset.rm).file = ''; changed(); renderSession(); return; }

  /* ---------- Firebase (Firestore + Auth via REST) ---------- */
  let fbCfgPromise = null;
  function fbConfig(){
    if(!fbCfgPromise) fbCfgPromise = (async () => {
      let cfg = null;
      if(/^https?:$/.test(location.protocol)){
        try{ const r = await fetch('/__/firebase/init.json', { cache:'no-store' }); if(r.ok) cfg = await r.json(); }catch(e){}
      }
      if(!(cfg && cfg.apiKey && cfg.projectId) && APP.firebase && APP.firebase.apiKey && APP.firebase.projectId) cfg = APP.firebase;
      return cfg && cfg.apiKey && cfg.projectId ? { apiKey: cfg.apiKey, projectId: cfg.projectId, authDomain: cfg.authDomain || `${cfg.projectId}.firebaseapp.com` } : null;
    })();
    return fbCfgPromise;
  }
  const docsBase = c => `https://firestore.googleapis.com/v1/projects/${c.projectId}/databases/(default)/documents`;
  const docName = (c, col, id) => `projects/${c.projectId}/databases/(default)/documents/${col}/${id}`;
  const toV = v => typeof v === 'number' ? (Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v })
    : typeof v === 'boolean' ? { booleanValue: v }
    : Array.isArray(v) ? { arrayValue: { values: v.map(toV) } }
    : v instanceof Date ? { timestampValue: v.toISOString() }
    : { stringValue: String(v) };
  const fromV = x => 'integerValue' in x ? +x.integerValue : 'doubleValue' in x ? x.doubleValue : 'booleanValue' in x ? x.booleanValue
    : 'timestampValue' in x ? Date.parse(x.timestampValue) : 'arrayValue' in x ? (x.arrayValue.values || []).map(fromV) : 'stringValue' in x ? x.stringValue : null;
  const toFields = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, toV(v)]));
  const fromDoc = d => { const o = {}; Object.entries(d.fields || {}).forEach(([k, v]) => { o[k] = fromV(v); }); o.id = d.name.split('/').pop(); return o; };

  function recordFor(res){
    return { unit: res.unit, unitNum: res.unitNum, session: res.n, grade: GRADE, section: res.section, name: res.name,
      score: res.score, total: res.total, answers: res.answers, createdAt: new Date(res.at) };
  }
  async function cloudAlreadyDone(c, id){
    const r = await fetch(`${docsBase(c)}/exitTicketsDone/${encodeURIComponent(id)}?key=${c.apiKey}`);
    if(r.status === 200) return true;
    if(r.status === 404) return false;
    throw new Error('check ' + r.status);
  }
  async function cloudSubmit(c, res){
    const body = { writes: [
      { update: { name: docName(c, 'exitTickets', res.id), fields: toFields(recordFor(res)) }, currentDocument: { exists: false } },
      { update: { name: docName(c, 'exitTicketsDone', res.id), fields: toFields({ at: new Date(res.at) }) }, currentDocument: { exists: false } }
    ] };
    const r = await fetch(`${docsBase(c)}:commit?key=${c.apiKey}`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if(r.ok) return 'ok';
    const err = await r.json().catch(() => ({}));
    const st = err.error && err.error.status;
    if(st === 'ALREADY_EXISTS' || st === 'FAILED_PRECONDITION') return 'dup';
    throw new Error(st || ('HTTP ' + r.status));
  }
  async function flushQueue(){

  /* teacher sign-in (Firebase Authentication, email + password) */
  const auth = () => lsGet(AUTH_KEY, null);
  async function signIn(c, email, password){
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${c.apiKey}`,
      { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email, password, returnSecureToken:true }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((j.error && j.error.message) || 'LOGIN');
    lsSet(AUTH_KEY, { email: j.email, idToken: j.idToken, refreshToken: j.refreshToken, exp: Date.now() + (+j.expiresIn || 3600) * 1000 });
  }
  const FB_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
  let gAuthP = null;
  function googleAuth(c){
    if(!gAuthP) gAuthP = (async () => {
      const [appM, authM] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-auth.js')]);
      const app = appM.initializeApp({ apiKey: c.apiKey, authDomain: c.authDomain, projectId: c.projectId }, 'ciencia-docente');
      const auth = authM.initializeAuth(app, { persistence: authM.inMemoryPersistence, popupRedirectResolver: authM.browserPopupRedirectResolver });
      return { auth, m: authM };
    })().catch(e => { gAuthP = null; throw e; });
    return gAuthP;
  }
  async function signInGoogle(c){
    const { auth, m } = await googleAuth(c);
    const provider = new m.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const cred = await m.signInWithPopup(auth, provider);
    const t = await cred.user.getIdTokenResult();
    lsSet(AUTH_KEY, { email: cred.user.email, idToken: t.token, refreshToken: cred.user.refreshToken, exp: Date.parse(t.expirationTime) || Date.now() + 3600e3 });

  function googleError(e){
    const code = (e && e.code) || '';
    if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '';
    if(code === 'auth/popup-blocked') return 'Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes para esta página e inténtalo otra vez.';
    if(code === 'auth/unauthorized-domain') return `Falta autorizar este sitio en Firebase: Authentication → Configuración → Dominios autorizados → agrega ${location.hostname}`;
    if(code === 'auth/configuration-not-found') return 'Falta activar Authentication en Firebase: Authentication → Comenzar, y luego habilita Google en «Método de acceso».';
    if(code === 'auth/operation-not-allowed') return 'Falta activar Google en Firebase: Authentication → Método de acceso → Google → Habilitar.';
    if(code === 'auth/network-request-failed' || !code) return 'No se pudo conectar con Google. Revisa tu internet e inténtalo otra vez.';
    return 'No se pudo ingresar con Google (' + code + ').';
  }
  async function idToken(c){
    const a = auth();
    if(!a) return null;
    if(Date.now() < a.exp - 60000) return a.idToken;
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${c.apiKey}`,
      { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.refreshToken) });
    if(!r.ok){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} return null; }
    const j = await r.json();
    lsSet(AUTH_KEY, { email: a.email, idToken: j.id_token, refreshToken: j.refresh_token, exp: Date.now() + (+j.expires_in || 3600) * 1000 });
    return j.id_token;
  }
  async function cloudList(c){
    const tok = await idToken(c);

    const out = [];
    let page = '';
    do{
      const r = await fetch(`${docsBase(c)}/exitTickets?pageSize=300${page ? '&pageToken=' + encodeURIComponent(page) : ''}&key=${c.apiKey}`, { headers:{ Authorization: 'Bearer ' + tok } });

      const j = await r.json();

    return out.map(r => ({ ...r, n: r.session, at: r.createdAt }));
  }
