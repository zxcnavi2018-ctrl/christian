<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innova Tacna - Maqueta 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f19; font-family: system-ui, sans-serif; }
  #hud { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(15,23,42,.85); padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  #hud b { font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #btns { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  #btns button { background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="hud">
  <b>Innova Schools Tacna 2026</b><br>
  Pabellones A · B · C · D · E · F<br>
  <span class="dot" style="background:#0072CE"></span>Inicial
  <span class="dot" style="background:#F37021"></span>Primaria
  <span class="dot" style="background:#78BE20"></span>Secundaria
  <span class="dot" style="background:#94A3B8"></span>ML / Lab <span class="dot" style="background:#f8fafc"></span>Sala docentes
</div>
<div id="btns">
  <button onclick="view('iso')">Isométrica</button>
  <button onclick="view('puente')">Puente 2.º piso</button>
  <button onclick="view('puertas')">Puertas</button>
  <button id="doorBtn" onclick="toggleDoors()">Abrir puertas</button>
  <button onclick="view('planta')">Planta</button>
</div>

<script>
const COL = { inicial: 0x0072CE, primaria: 0xF37021, secundaria: 0x78BE20, lab: 0x94A3B8, prof: 0xf8fafc, topico: 0xf87171, bano: 0x38bdf8 };
const FH = 3.2;      // alto de piso
const RH = 3.0;      // alto del salón

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x90c2f9);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2 - 0.02;

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(30, 60, 40);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x9a9a94 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function label(text, x, y, z, scale = 2.2, color = '#ffffff', bg = 'rgba(15,23,42,.8)') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, 512, 128);
  g.fillStyle = color; g.font = 'bold 76px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
  s.position.set(x, y, z);
  s.scale.set(scale * 2, scale * 0.5, 1);
  scene.add(s);
}

function flat(w, d, x, z, color, y = 0.05, h = 0.1) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

// rot: giro en Y. side: cara donde va la etiqueta ('x' o 'z' local)
function room(name, level, cx, floor, cz, w, d, o = {}) {
  const rot = o.rot || 0;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, RH, d), new THREE.MeshLambertMaterial({ color: COL[level] }));
  m.position.set(cx, floor * FH + RH / 2, cz);
  m.rotation.y = rot;
  scene.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x1e293b }));
  e.position.copy(m.position); e.rotation.y = rot;
  scene.add(e);
  if (name) {
    const lx = o.side === 'z' ? 0 : w / 2 + 0.05, lz = o.side === 'z' ? d / 2 + 0.05 : 0;
    label(name, cx + lx * Math.cos(rot) + lz * Math.sin(rot), m.position.y, cz - lx * Math.sin(rot) + lz * Math.cos(rot), 2.6);
  }
}

// ================= PATIO (centro), CANCHA y ÁREA VERDE =================
flat(32, 29.5, -3, -1.75, 0xb3ae9f, 0.02, 0.04);                       // patio
label('PATIO', -4, 0.4, -13, 3, '#fff', 'rgba(71,85,105,.9)');
// cancha de losa
flat(18.5, 10, -3.25, -5, 0x64748b, 0.06, 0.1);
(function courtLines() {
  const pts = [[-12.5, -10], [6, -10], [6, 0], [-12.5, 0]].map(p => new THREE.Vector3(p[0], 0.13, p[1]));
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff })));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3.25, 0.13, -10), new THREE.Vector3(-3.25, 0.13, 0)]), new THREE.LineBasicMaterial({ color: 0xffffff })));
})();
label('CANCHA DE LOSA', -3.25, 1.2, -5, 3.4, '#fff', 'rgba(30,41,59,.9)');
// área verde pequeña
flat(3.2, 11, -17, -3.5, 0x4ade80, 0.06, 0.12);
[-8, -4, 0].forEach(z => {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.4, 8), new THREE.MeshLambertMaterial({ color: 0x78350f }));
  t.position.set(-17, 0.8, z); scene.add(t);
  const c = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), new THREE.MeshLambertMaterial({ color: 0x15803d }));
  c.position.set(-17, 2.1, z); scene.add(c);
});
label('ÁREA VERDE', -17, 4, -3.5, 2.4, '#fff', 'rgba(22,101,52,.9)');

// ================= PABELLÓN B (3 pisos, 7 módulos a lo largo de Z) =================
const B = { x: -24, z0: -30, sw: 6, depth: 6 };
const B_ROWS = [
  [['KA','inicial'], ['PkB','inicial'], ['PkA','inicial'], ['BgC','inicial'], ['BgB','inicial'], ['BgA','inicial'], ['Docentes','prof']],
  [['5B','primaria'], ['5A','primaria'], ['6D','primaria'], ['6C','primaria'], ['LAB','lab'], ['6B','primaria'], ['7A','secundaria']],
  [['9D','secundaria'], ['9C','secundaria'], ['9B','secundaria'], ['9A','secundaria'], ['8C','secundaria'], ['ML','lab'], ['ML','lab']]
];
B_ROWS.forEach((row, f) => row.forEach((r, i) => {
  room(r[0], r[1], B.x, f, B.z0 + (i + 0.5) * B.sw, B.sw - 0.15, B.depth - 0.2);
}));
['I', 'II', 'III'].forEach((n, f) => label(n, B.x, f * FH + RH / 2, B.z0 - 2.5, 1.0, '#fde047'));
label('PABELLÓN B', B.x, 3 * FH + 1.2, B.z0 + 3.5 * B.sw, 3, '#fff', 'rgba(0,114,206,.9)');

// pasadizos (corredores) pegados a B en pisos 2 y 3 + escalera
const bFace = B.x + B.depth / 2;                // x = -21
const railMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
(function stairs() {
  const n = 11, rise = FH / n, run = 0.29;
  for (let i = 0; i < n; i++) {
    const h = (i + 1) * rise;
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.8, h, run), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    st.position.set(bFace + 0.9, h / 2, 10.2 - (i + 0.5) * run);
    scene.add(st);
  }
  for (let i = 0; i < n; i++) {   // segundo tramo: piso 2 -> piso 3
    const st = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, run), new THREE.MeshLambertMaterial({ color: 0xcbd5e1 }));
    st.position.set(bFace + 0.9, FH + (i + 1) * rise - 0.1, 7 + (i + 0.5) * run);
    scene.add(st);
  }
  label('ESCALERA', bFace + 0.9, FH + 1.4, 9.5, 1.2, '#111', 'rgba(250,204,21,.95)');
})();

// ================= PABELLÓN D (3 pisos, 2 módulos a lo largo de X) =================
const D = { zc: 6, xc: [-11.7, -5.7], sw: 6, depth: 6 };
const D_COLS = [
  [['2B','primaria'], ['ML','lab'], ['ML','lab']],      // módulo hacia B (de aquí sale el puente)
  [['2C','primaria'], ['ML','lab'], ['ML','lab']]
];
D_COLS.forEach((col, k) => col.forEach((r, f) => {
  room(r[0], r[1], D.xc[k], f, D.zc, D.sw - 0.15, D.depth - 0.2, { side: 'z' });
}));
['I', 'II', 'III'].forEach((n, f) => label(n, D.xc[1] + 3.8, f * FH + RH / 2, D.zc, 1.0, '#fde047'));
label('PABELLÓN D', -8.7, 3 * FH + 1.2, D.zc, 3, '#fff', 'rgba(244,114,22,.9)');

// ================= PABELLÓN E (frente a B, al otro lado del patio) =================
const E = { zc: -20, xc: [9, 3, -3, -9], sw: 6, depth: 6 };
const E_SLOTS = [
  [['2A','primaria'], ['4D','primaria'], ['10D','secundaria']],
  [['1C','primaria'], ['4C','primaria'], ['10C','secundaria']],
  [['1B','primaria'], ['Docentes','prof'], ['10B','secundaria']],
  [['1A','primaria'], ['6A','primaria'], ['10A','secundaria']]
];
E_SLOTS.forEach((col, k) => col.forEach((r, f) => {
  room(r[0], r[1], E.xc[k], f, E.zc, E.sw - 0.15, E.depth - 0.2, { side: 'z' });
}));
label('PABELLÓN E', 0, 3 * FH + 1.2, E.zc, 3, '#fff', 'rgba(244,114,22,.9)');

// ================= PABELLÓN A (atrás, a la izquierda de B) =================
const A = { zc: -14.7, xc: [-38.5, -44.5], sw: 6, depth: 6 };
room('KB', 'inicial', A.xc[0], 0, A.zc, 5.85, 5.8, { side: 'z' });
room('5C', 'primaria', A.xc[0], 1, A.zc, 5.85, 5.8, { side: 'z' });
room('KC', 'inicial', A.xc[1], 0, A.zc, 5.85, 5.8, { side: 'z' });
label('PABELLÓN A', -41.5, 2 * FH + 1.2, A.zc, 3, '#fff', 'rgba(0,114,206,.9)');

// ================= PABELLÓN F (diagonal, lado derecho) =================
const F = { x: 21.3, z: -2.3, rot: 0.849, sw: 5.5, depth: 6 };
const F_ROWS = [
  [['2D','primaria'], ['3A','primaria'], ['3B','primaria'], ['3C','primaria'], ['3D','primaria']],
  [['7B','secundaria'], ['7C','secundaria'], ['7D','secundaria'], ['8A','secundaria'], ['8B','secundaria']],
  [null, null, null, ['4A','primaria'], ['4B','primaria']]
];
F_ROWS.forEach((row, f) => row.forEach((r, i) => {
  if (!r) return;
  const lx = (i - 2) * F.sw;
  room(r[0], r[1], F.x + lx * Math.cos(F.rot), f, F.z - lx * Math.sin(F.rot), F.sw - 0.15, F.depth - 0.2, { rot: F.rot, side: 'z' });
}));
label('PABELLÓN F', F.x, 3 * FH + 1.2, F.z, 3, '#fff', 'rgba(120,190,32,.9)');

// ================= PASADIZOS (pisos 2 y 3) =================
// walkway: losa de 1.8 m de ancho + baranda. lx/lz = centro local respecto a (ox, oz), rot = giro del pabellón,
// outer = lado de la baranda (+1 / -1 sobre el eje local z)
function walkway(ox, oz, lx, lz, len, rot, floor, outer) {
  const c = Math.cos(rot), sn = Math.sin(rot);
  const wx = ox + lx * c + lz * sn, wz = oz - lx * sn + lz * c;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(len, 0.2, 1.8), new THREE.MeshLambertMaterial({ color: 0xa8b3c4 }));
  slab.position.set(wx, floor * FH - 0.1, wz); slab.rotation.y = rot; scene.add(slab);
  const ro = outer * 0.87;
  const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.06, 0.06), new THREE.MeshLambertMaterial({ color: 0x334155 }));
  rail.position.set(wx + ro * sn, floor * FH + 1.0, wz + ro * c); rail.rotation.y = rot; scene.add(rail);
}
// B: cara hacia el patio (+x). Piso 2 hasta la escalera (z=7), piso 3 hasta z=12
walkway(bFace + 0.9, -11.5, 0, 0, 37, Math.PI / 2, 1, +1);
walkway(bFace + 0.9, -9, 0, 0, 42, Math.PI / 2, 2, +1);
// D: cara hacia el patio (-z)
[1, 2].forEach(f => walkway(-8.7, D.zc - D.depth / 2 - 0.9, 0, 0, 12, 0, f, -1));
// E: cara hacia el patio (+z)
[1, 2].forEach(f => walkway(0, E.zc + E.depth / 2 + 0.9, 0, 0, 24, 0, f, +1));
// A: frente al 5C (piso 2)
walkway(A.xc[0], A.zc + A.depth / 2 + 0.9, 0, 0, 6, 0, 1, +1);
// F: cara hacia el patio (-z local). Piso 2 completo, piso 3 solo frente a 4A y 4B
walkway(F.x, F.z, 0, -(F.depth / 2 + 0.9), 27.5, F.rot, 1, -1);
walkway(F.x, F.z, 8.25, -(F.depth / 2 + 0.9), 11, F.rot, 2, -1);

// ================= PABELLÓN C: lobby en L con puertas de vidrio =================
room('', 'lab', -24, 0, 17.25, 14, 7.5);          // cuerpo principal x -31..-17, z 13.5..21
room('', 'lab', -25.5, 0, 27, 9, 12);             // brazo hacia la fila de servicios x -30..-21, z 21..33
label('LOBBY', -24, RH + 0.8, 17.25, 3, '#fff', 'rgba(100,116,139,.95)');
label('PABELLÓN C', -24, FH + 2.4, 17.25, 3, '#fff', 'rgba(100,116,139,.95)');
(function glass() {
  const gm = new THREE.MeshLambertMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.4 });
  const frame = new THREE.MeshLambertMaterial({ color: 0x0f172a });
  // frente del brazo (hacia la calle)
  for (let i = 0; i < 3; i++) {
    const x = -28.5 + i * 3;
    const p = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.4, 0.08), gm); p.position.set(x, 1.3, 33.06); scene.add(p);
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.4, 0.12), frame); f.position.set(x + 1.45, 1.3, 33.06); scene.add(f);
  }
  // lado hacia la entrada
  for (let i = 0; i < 2; i++) {
    const z = 28 + i * 2.5;
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.4, 2.3), gm); p.position.set(-20.96, 1.3, z); scene.add(p);
  }
})();

// fila de servicios junto al muro: Entrada (cerca al lobby) | Baño (centro) | Tópico (junto al muro)
const SZ = { zc: 30, depth: 7 };
const cParts = [
  { n: 'ENTRADA', level: null,    w: 4.5, x: -18.75 },
  { n: 'BAÑO',    level: 'bano',   w: 4.0, x: -14.5 },
  { n: 'TÓPICO',  level: 'topico', w: 5.5, x: -9.75 }
];
cParts.forEach(q => {
  if (q.level) { room(q.n, q.level, q.x, 0, SZ.zc, q.w - 0.1, SZ.depth - 0.2, { side: 'z' }); return; }
  const mat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });
  const roof = new THREE.Mesh(new THREE.BoxGeometry(q.w, 0.4, SZ.depth - 0.2), mat);
  roof.position.set(q.x, RH - 0.2, SZ.zc); scene.add(roof);
  [-1, 1].forEach(k => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(q.w, RH, 0.3), mat);
    w.position.set(q.x, RH / 2, SZ.zc + k * (SZ.depth / 2 - 0.25)); scene.add(w);
  });
  label(q.n, q.x, RH + 0.8, SZ.zc, 1.6, '#fff', 'rgba(22,163,74,.95)');
});

// ================= PUENTE: ML (D, piso 2) -> corredor de B, entre 6B y 7A =================
const bz = B.z0 + 6 * B.sw;                    // límite entre 6B y 7A (z = 6)
const bx1 = bFace + 1.8;                        // borde exterior del corredor
const bx2 = D.xc[0] - D.sw / 2;                 // cara de D hacia B
const bridge = new THREE.Mesh(new THREE.BoxGeometry(bx2 - bx1, 2.6, 2.2), new THREE.MeshLambertMaterial({ color: 0xfacc15, transparent: true, opacity: 0.85 }));
bridge.position.set((bx1 + bx2) / 2, FH + 1.4, bz);
scene.add(bridge);
const be = new THREE.LineSegments(new THREE.EdgesGeometry(bridge.geometry), new THREE.LineBasicMaterial({ color: 0x713f12 }));
be.position.copy(bridge.position); scene.add(be);
label('PUENTE', bridge.position.x, FH + 4.4, bz, 1.8, '#111', 'rgba(250,204,21,.95)');
label('entre 6B y 7A', bridge.position.x, FH + 5.6, bz, 2.0, '#fff', 'rgba(15,23,42,.85)');

// ================= INGRESO =================
label('INGRESO', -9, 6.4, 26, 2, '#fff', 'rgba(22,163,74,.95)');

// ---------- Puertas del ingreso (4 bahías, todas dobles) ----------
const pivots = [];
let doorsOpen = false, doorAngle = 0;
(function buildDoors() {
  const g = new THREE.Group();
  g.position.set(-6, 0, 26);
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });
  const wood = new THREE.MeshLambertMaterial({ color: 0x854d0e });
  const dark = new THREE.MeshLambertMaterial({ color: 0x1e293b });
  const logo = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3.8, 9), wallMat);
  logo.position.set(-0.475, 1.9, 3.9); g.add(logo);
  const bays = [
    { n: '1 Principal', w: 2.8, roof: true },
    { n: '2', w: 2.8, roof: true },
    { n: '3', w: 2.8, roof: true },
    { n: '4 Sin techo', w: 4.6, roof: false }
  ];
  let cx = 0;
  bays.forEach((b, i) => {
    const bg = new THREE.Group(); bg.position.x = cx;
    [0, b.w].forEach(px => { const c = new THREE.Mesh(new THREE.BoxGeometry(0.35, 3.6, 1.2), wallMat); c.position.set(px, 1.8, 0); bg.add(c); });
    if (b.roof) { const r = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.35, 0.5, 1.6), wallMat); r.position.set(b.w / 2, 3.35, 0); bg.add(r); }
    const lw = (b.w - 0.35) / 2;
    const mk = (px, dir) => {
      const pv = new THREE.Group(); pv.position.set(px, 1.4, 0);
      const leaf = new THREE.Mesh(new THREE.BoxGeometry(lw, 2.6, 0.1), i < 3 ? wood : new THREE.MeshLambertMaterial({ color: 0xffffff }));
      leaf.position.x = dir * lw / 2; pv.add(leaf);
      if (i < 3) { const f = new THREE.Mesh(new THREE.BoxGeometry(lw, 2.6, 0.06), dark); f.position.set(dir * lw / 2, 0, -0.04); pv.add(f); }
      bg.add(pv); return pv;
    };
    pivots.push({ l: mk(0.18, 1), r: mk(b.w - 0.18, -1) });
    g.add(bg);
    cx += b.w + 0.45;
  });
  scene.add(g);
  // etiquetas
  bays.forEach((b, i) => {
    const bx = -6 + bays.slice(0, i).reduce((a, q) => a + q.w + 0.45, 0) + b.w / 2;
    label(b.n, bx, 4.6, 26.8, 1.4, '#fff', 'rgba(15,23,42,.9)');
  });
})();
function toggleDoors() {
  doorsOpen = !doorsOpen;
  document.getElementById('doorBtn').textContent = doorsOpen ? 'Cerrar puertas' : 'Abrir puertas';
}


// ---------- Cámaras ----------
const presets = {
  iso:    { p: [50, 62, 78],  t: [-8, 0, 3] },
  puente: { p: [-8, 12, 24],  t: [-17, 4, 6] },
  puertas:{ p: [0, 9, 56],    t: [0, 2, 26] },
  planta: { p: [-8, 130, 3],  t: [-8, 0, 2] }
};
function view(k) {
  camera.position.set(...presets[k].p);
  controls.target.set(...presets[k].t);
  controls.update();
}
view('iso');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop);
  doorAngle += ((doorsOpen ? Math.PI / 2.2 : 0) - doorAngle) * 0.08;
  pivots.forEach(q => { q.l.rotation.y = -doorAngle; q.r.rotation.y = doorAngle; });
  controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
