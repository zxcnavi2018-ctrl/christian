.diploma-card.locked::after{opacity:.15 !important}
.diploma-icon{font-size:clamp(50px,12vw,100px);margin-bottom:8px;animation:diplomaBounce 2.5s ease-in-out infinite}
.diploma-title{position:relative;font-size:clamp(16px,2vw,20px);font-weight:900;line-height:1.08;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.35);letter-spacing:.02em}

.card small{position:relative;font-size:clamp(11.5px,1.4vw,13.5px);font-weight:800;opacity:.95}

.card .pg{position:relative;height:6px;margin-top:6px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.card .pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fff,#fde68a)}
.card.lock{filter:saturate(.3) brightness(.7);pointer-events:none}

let all=0,got=0;
const card=(c,i)=>{
 if(c.isDiploma){
  const isUnlocked=all>0&&all===got;
  if(isUnlocked){
   return`<div class="diploma-card" style="--g:${c.g};--i:${i};box-shadow:0 0 40px rgba(251,191,36,.5),0 18px 34px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -10px 24px rgba(0,0,0,.18) !important" title="¡Has completado todos los juegos!"><div class="diploma-icon">🏆</div><b class="diploma-title">${c.t}</b><small class="diploma-subtitle">✨ Has demostrado alta capacidad<br>autónoma para aprender ✨</small></div>`;
  }else{
   return`<div class="diploma-card locked" style="--g:${c.g};--i:${i}" aria-disabled="true"><div class="diploma-locked-badge">🔒</div><b class="diploma-title">${c.t}</b><small class="diploma-subtitle">🎯 Completa todos los juegos<br>para desbloquear tu premio</small></div>`;
  }
 }
 const done=Math.min(c.n,Object.values(get(c.k)).filter(Boolean).length);if(c.href){all+=c.n;got+=done}const st=!c.href?'🔒 Pronto':done>=c.n?'✅ Listo':`🎯 ${done}/${c.n}`;
 const inner=`<span class="art">${ART[c.k]}</span><span class="st">${st}</span><b>${c.t}</b><small>${c.href?c.s:'Muy pronto'}</small><span class="pg"><i style="width:${done/c.n*100}%"></i></span>`;
 return c.href?`<a class="card" href="${c.href}?u=${encodeURIComponent(U)}&t=${Date.now()}" style="--g:${c.g};--i:${i}">${inner}</a>`:`<div class="card lock" style="--g:${c.g};--i:${i}" aria-disabled="true">${inner}</div>`};
const g=document.getElementById('grid');g.innerHTML=C.map(card).join('');
document.getElementById('tot').innerHTML=`🎯 ${got}/${all}<span class="w">&nbsp;misiones</span>`;
// Inclinación 3D y brillo que sigue al ratón
g.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--ry',((x-.5)*14).toFixed(1)+'deg');c.style.setProperty('--rx',((.5-y)*12).toFixed(1)+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')});
g.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
// Sonido suave al entrar a un juego
g.addEventListener('click',e=>{if(!e.target.closest('a.card'))return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.type='triangle';o.frequency.setValueAtTime(520,a.currentTime);o.frequency.exponentialRampToValueAtTime(1040,a.currentTime+.15);v.gain.setValueAtTime(.06,a.currentTime);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.26)}catch(_){}});
document.getElementById('salir').onclick=()=>{if(parent!==window)parent.postMessage('lab:close','*');else history.back()};
// Splash screen: mostrar por 1.8s
const splash=document.getElementById('splash');if(splash&&!sessionStorage.getItem('lab:splash-shown')){setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>{splash.style.display='none'},600)},1800);sessionStorage.setItem('lab:splash-shown','1')}else if(splash){splash.style.display='none'}
// Help button: mostrar tips
const TIPS={circ:'Arrastra componentes para armar el circuito. Los LED encendidos = éxito.',plac:'Gira y observa: continentes chocan, crean montañas.',ener:'Reparte las energías: solar, eólica, hidroeléctrica. Salva la isla.',evo:'Selecciona las criaturas que pueden sobrevivir. Solo los más adaptados avanzan.',enf:'Clasifica síntomas y patógenos. Vence todas las enfermedades.',maq:'Identifica máquinas simples en máquinas compuestas.',sol:'Ordena los 8 planetas por distancia al Sol.',luna:'Observa cómo la Luna orbita la Tierra. Ve las mareas cambiar.',cad:'Construye cadenas: planta → herbívoro → carnívoro.',eco:'Clasifica seres vivos en sus ecosistemas.',tens:'Experimenta con tensión superficial: agua en capas, gotas, meniscos.'};
const modal=document.getElementById('help-modal');
const modalContent=document.getElementById('tips-container');
document.getElementById('help').onclick=()=>{const games=C.filter(c=>c.href).map(c=>c.k);modalContent.innerHTML=games.map(k=>`<div class="tip-item"><strong>${C.find(c=>c.k===k).t}</strong>${TIPS[k]}</div>`).join('');modal.classList.add('open')};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))modal.classList.remove('open')});
</script>
