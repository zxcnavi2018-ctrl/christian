<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ciencia · 4to Bimestre</title>
<style>
  :root{
    --bg1:#eaf2ff;
    --bg2:#dff3ff;
    --navy:#12224a;
    --navy-2:#1c2f5e;
    --blue:#2f6fed;
    --cyan:#38d1f5;
    --card:#ffffff;
    --card-border:#dfe8fb;
    --shadow: 0 14px 30px rgba(18,34,74,.14);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffffff 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #d8ecff 0%, transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--navy);
    overflow-x:hidden;
  }
  #app{
    position:relative;
    min-height:100vh;
    width:100%;
    max-width:980px;
    margin:0 auto;
    padding:20px 20px 48px;
  }

  /* ---------- Screens ---------- */
  .screen{
    display:none;
    min-height:calc(100vh - 68px);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    animation:fadeIn .45s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Back arrow (flecha transversal) ---------- */
  .back-btn{
    position:fixed;
    top:18px;
    left:18px;
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(18,34,74,.28);
    z-index:50;
    transition:transform .18s ease, background .18s ease;
  }
  .back-btn:hover{ transform:translateY(-2px) scale(1.06); background:var(--blue); }
  .back-btn:active{ transform:scale(.94); }
  .back-btn svg{
    width:26px;
    height:26px;
    transform:rotate(-45deg);
  }

  /* ---------- Robot (shared component) ---------- */
  .robot-slot{
    display:block;
    line-height:0;
    flex-shrink:0;
  }
  .robot-slot svg{
    display:block;
    width:100%;
    height:auto;
  }
  .robot-slot--home{ width:min(42vw, 180px); }
  .robot-slot--menu{ width:min(34vw, 150px); }
  .robot-slot--session{ width:76px; }

  .robot-float{ animation:floaty 3.2s ease-in-out infinite; }
  @keyframes floaty{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-10px);}
  }

  .robot-eye{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 5s ease-in-out infinite;
  }
  @keyframes blink{
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.12); }
  }
  .robot-pupils{ transition: transform .12s ease-out; }
  .robot-antenna-tip{ animation: glow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin:50% 50%; }
  @keyframes glow{
    0%,100%{ opacity:.65; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.18); }
  }

  /* ---------- HOME ---------- */
  .home-content{
    text-align:center;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:20px;
    user-select:none;
  }
  .home-content h1{
    font-size:clamp(42px, 10vw, 78px);
    margin:0;
    letter-spacing:2px;
    background:linear-gradient(90deg, var(--navy), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  .home-content h2{
    margin:0 0 6px;
    font-size:clamp(20px, 4.5vw, 30px);
    color:var(--blue);
    font-weight:600;
  }
  .home-content .robot-slot{ margin:14px 0 6px; }
  .hint{
    margin-top:10px;
    font-size:clamp(14px,3vw,17px);
    color:#5a6a94;
    padding:10px 22px;
    background:#ffffffb0;
    border:1px solid var(--card-border);
    border-radius:999px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }

  /* ---------- MENU (choose unit) ---------- */
  .menu-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:100%;
  }
  .bubble{
    position:relative;
    background:var(--card);
    border:2px solid var(--card-border);
    border-radius:22px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    margin-top:20px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .bubble::before{
    content:"";
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:20px;height:20px;
    background:var(--card);
    border-left:2px solid var(--card-border);
    border-top:2px solid var(--card-border);
  }
  .bubble-question{
    margin:0 0 16px;
    font-size:clamp(16px,3.4vw,19px);
    font-weight:700;
    color:var(--navy-2);
  }
  .bubble-choices{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .choice-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:#f4f8ff;
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:12px 14px;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  }
  .choice-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 22px rgba(18,34,74,.18);
    background:var(--navy);
    color:#fff;
  }
  .choice-btn:active{ transform:translateY(-1px) scale(.98); }
  .choice-num{
    width:38px;height:38px;
    flex-shrink:0;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
  }
  .choice-text{ display:flex; flex-direction:column; line-height:1.3; }
  .choice-text b{ font-size:15px; }
  .choice-text small{ font-size:12.5px; opacity:.75; font-weight:500; }

  /* ---------- UNIT SESSION GRID ---------- */
  .unit-title{
    text-align:center;
    font-size:clamp(20px,4vw,28px);
    margin:0 0 22px;
    color:var(--navy);
    padding:0 60px;
  }
  .unit-sub{
    text-align:center;
    color:var(--blue);
    font-weight:600;
    margin:-14px 0 26px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .session-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(140px,1fr));
    gap:18px;
    width:100%;
    max-width:640px;
  }
  .session-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:24px 12px;
    text-align:center;
    cursor:pointer;
    font-size:clamp(15px,3vw,18px);
    font-weight:700;
    color:var(--navy-2);
    box-shadow:0 8px 18px rgba(18,34,74,.1);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .session-btn .dot{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#fff; display:flex;align-items:center;justify-content:center;
    font-size:15px; font-weight:800;
  }
  .session-btn:hover{
    transform:translateY(-5px);
    box-shadow:0 16px 26px rgba(18,34,74,.18);
    background:var(--navy);
    color:#fff;
  }
  .session-btn:hover .dot{ background:#fff; color:var(--navy); }
  .session-btn:active{ transform:translateY(-1px) scale(.97); }

  /* ---------- SESSION CONTENT ---------- */
  .session-content{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 30px;
    text-align:center;
    max-width:560px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .session-content .badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#fff;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:14px;
  }
  .session-content h2{ margin:0 0 10px; color:var(--navy); }
  .session-content p{ color:#5a6a94; line-height:1.5; margin:0; }
  .session-content .robot-slot{ margin-bottom:14px; }

  /* ---------- Mobile tweaks ---------- */
  @media (max-width:560px){
    .session-grid{ grid-template-columns:repeat(2, 1fr); }
    .unit-title{ padding:0 50px; }
    .back-btn{ width:48px; height:48px; top:14px; left:14px; }
    .back-btn svg{ width:22px; height:22px; }
    #app{ padding:16px 14px 40px; }
  }
</style>
</head>
<body>

<!-- Shared gradient defs referenced by every robot instance -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gradHelmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe4f5"/>
    </linearGradient>
    <linearGradient id="gradEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3d0ea"/>
      <stop offset="100%" stop-color="#9aabd4"/>
    </linearGradient>
    <linearGradient id="gradVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243a6e"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <radialGradient id="gradEye" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a6f2ff"/>
      <stop offset="55%" stop-color="#38d1f5"/>
      <stop offset="100%" stop-color="#1aa9d6"/>
    </radialGradient>
    <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4eaf9"/>
      <stop offset="100%" stop-color="#c3d0ea"/>
    </linearGradient>
  </defs>
</svg>

<!-- Robot template (cloned into each screen) -->
<template id="robotTemplate">
  <svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="120" cy="246" rx="62" ry="9" fill="#12224a" opacity=".10"/>
    <!-- antenna -->
    <line x1="120" y1="18" x2="120" y2="4" stroke="#9aabd4" stroke-width="4" stroke-linecap="round"/>
    <circle class="robot-antenna-tip" cx="120" cy="6" r="6" fill="#38d1f5"/>
    <!-- shoulders / body hint -->
    <path d="M50 210c0-30 31-46 70-46s70 16 70 46v14H50z" fill="url(#gradBody)"/>
    <!-- ears -->
    <circle cx="34" cy="120" r="22" fill="url(#gradEar)"/>
    <circle cx="30" cy="113" r="7" fill="#ffffff" opacity=".35"/>
    <circle cx="206" cy="120" r="22" fill="url(#gradEar)"/>
    <circle cx="202" cy="113" r="7" fill="#ffffff" opacity=".35"/>
    <!-- head -->
    <rect x="46" y="30" width="148" height="150" rx="58" fill="url(#gradHelmet)"/>
    <path d="M64 44c30-14 82-14 112 0" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".55"/>
    <!-- visor -->
    <rect x="70" y="78" width="100" height="64" rx="30" fill="url(#gradVisor)"/>
    <!-- eyes -->
    <g class="robot-pupils">
      <ellipse class="robot-eye eye-l" cx="98" cy="110" rx="12" ry="18" fill="url(#gradEye)"/>
      <ellipse class="robot-eye eye-r" cx="142" cy="110" rx="12" ry="18" fill="url(#gradEye)"/>
      <circle cx="94" cy="103" r="3.4" fill="#ffffff" opacity=".9"/>
      <circle cx="138" cy="103" r="3.4" fill="#ffffff" opacity=".9"/>
    </g>
    <!-- cheeks -->
    <circle cx="66" cy="150" r="8" fill="#ff9fc0" opacity=".35"/>
    <circle cx="174" cy="150" r="8" fill="#ff9fc0" opacity=".35"/>
    <!-- mouth -->
    <rect x="90" y="156" width="60" height="16" rx="8" fill="#eef2fb"/>
    <rect x="102" y="160" width="10" height="8" rx="3" fill="#c3d0ea"/>
    <rect x="128" y="160" width="10" height="8" rx="3" fill="#c3d0ea"/>
  </svg>
</template>

<div id="app">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="home-content" id="homeTap">
      <h1>CIENCIA</h1>
      <h2>4to Bimestre</h2>
      <div class="robot-slot robot-slot--home robot-float" data-robot></div>
      <div class="hint">👉 Toca la pantalla para comenzar</div>
    </div>
  </section>

  <!-- MENU: choose unit -->
  <section class="screen" id="screen-menu">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="menu-wrap">
      <div class="robot-slot robot-slot--menu robot-float" data-robot></div>
      <div class="bubble">
        <p class="bubble-question">¿Qué unidad deseas aprender? 🤖</p>
        <div class="bubble-choices">
          <button class="choice-btn" onclick="goTo('unit7')">
            <span class="choice-num">7</span>
            <span class="choice-text"><b>Unidad 7</b><small>Microorganismos en acción</small></span>
          </button>
          <button class="choice-btn" onclick="goTo('unit8')">
            <span class="choice-num">8</span>
            <span class="choice-text"><b>Unidad 8</b><small>El sistema reproductor humano</small></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- UNIT 7 -->
  <section class="screen" id="screen-unit7">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="unit-sub">Unidad 7</div>
    <h2 class="unit-title">Microorganismos en acción</h2>
    <div class="session-grid" id="grid-unit7"></div>
  </section>

  <!-- UNIT 8 -->
  <section class="screen" id="screen-unit8">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="unit-sub">Unidad 8</div>
    <h2 class="unit-title">El sistema reproductor humano</h2>
    <div class="session-grid" id="grid-unit8"></div>
  </section>

  <!-- SESSION CONTENT -->
  <section class="screen" id="screen-session">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="session-content">
      <div class="robot-slot robot-slot--session" data-robot></div>
      <div class="badge" id="sessionUnitLabel">UNIDAD</div>
      <h2 id="sessionTitle">Sesión 1</h2>
      <p>El contenido de esta sesión se agregará próximamente. Vuelve pronto 🚀</p>
    </div>
  </section>

</div>

<script>
  // ---------- Instantiate the robot into every slot ----------
  const robotInstances = [];
  document.querySelectorAll('[data-robot]').forEach((slot, i) => {
    const tpl = document.getElementById('robotTemplate').content.cloneNode(true);
    const svg = tpl.querySelector('svg');
    const eyeL = svg.querySelector('.eye-l');
    const eyeR = svg.querySelector('.eye-r');
    eyeL.style.animationDelay = (i * 0.35) + 's';
    eyeR.style.animationDelay = (i * 0.35) + 's';
    slot.appendChild(svg);
    robotInstances.push({
      svg,
      pupils: svg.querySelector('.robot-pupils')
    });
  });

  // ---------- Eyes follow the pointer / touch ----------
  const EYE_MAX_OFFSET = 7.5;
  const VIEWBOX_W = 240;
  let ticking = false;

  function updateEyes(px, py){
    robotInstances.forEach(inst => {
      const rect = inst.svg.getBoundingClientRect();
      if(rect.width === 0) return;
      const scale = VIEWBOX_W / rect.width;
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.42;
      const dx = px - cx;
      const dy = py - cy;
      const dist = Math.min(1, Math.sqrt(dx*dx + dy*dy) / 180);
      const angle = Math.atan2(dy, dx);
      const ox = Math.cos(angle) * EYE_MAX_OFFSET * dist * scale;
      const oy = Math.sin(angle) * EYE_MAX_OFFSET * 0.7 * dist * scale;
      inst.pupils.style.transform = `translate(${ox}px, ${oy}px)`;
    });
    ticking = false;
  }

  function queueEyeUpdate(px, py){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => updateEyes(px, py));
  }

  window.addEventListener('mousemove', e => queueEyeUpdate(e.clientX, e.clientY));

  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if(t) queueEyeUpdate(t.clientX, t.clientY);
  }, { passive:true });

  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if(t) queueEyeUpdate(t.clientX, t.clientY);
  }, { passive:true });

  window.addEventListener('touchend', () => {
    robotInstances.forEach(inst => { inst.pupils.style.transform = 'translate(0,0)'; });
  });

  // ---------- Build the 8 session buttons for each unit ----------
  function buildSessions(unitKey){
    const grid = document.getElementById('grid-' + unitKey);
    grid.innerHTML = '';
    for(let i = 1; i <= 8; i++){
      const btn = document.createElement('div');
      btn.className = 'session-btn';
      btn.innerHTML = '<span class="dot">' + i + '</span><span>Sesión ' + i + '</span>';
      btn.onclick = () => openSession(unitKey, i);
      grid.appendChild(btn);
    }
  }
  buildSessions('unit7');
  buildSessions('unit8');

  // ---------- Navigation with history stack ----------
  const stack = [];
  let current = 'home';

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
    current = id;
  }

  function goTo(id){
    stack.push(current);
    showScreen(id);
  }

  function goBack(){
    const prev = stack.pop() || 'home';
    showScreen(prev);
  }

  function openSession(unitKey, num){
    document.getElementById('sessionUnitLabel').textContent =
      unitKey === 'unit7' ? 'UNIDAD 7 · MICROORGANISMOS EN ACCIÓN' : 'UNIDAD 8 · SISTEMA REPRODUCTOR HUMANO';
    document.getElementById('sessionTitle').textContent = 'Sesión ' + num;
    goTo('session');
  }

  document.getElementById('homeTap').addEventListener('click', () => goTo('menu'));
</script>

</body>
</html>
