<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ciencia · 4to Bimestre</title>
<style>
  :root{
    --bg1:#eaf2ff;
    --bg2:#dff3ff;
    --navy:#12224a;
    --navy-2:#1c2f5e;
    --blue:#2f6fed;
    --cyan:#38d1f5;
    --card:#ffffff;
    --card-border:#dfe8fb;
    --shadow: 0 14px 30px rgba(18,34,74,.14);
    --radius: 22px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffffff 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #d8ecff 0%, transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--navy);
    overflow-x:hidden;
  }
  #app{
    position:relative;
    min-height:100vh;
    width:100%;
    max-width:980px;
    margin:0 auto;
    padding:20px 20px 48px;
  }

  /* ---------- Screens ---------- */
  .screen{
    display:none;
    min-height:calc(100vh - 68px);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    animation:fadeIn .45s ease;
  }
  .screen.active{display:flex;}
  /* content taller than the viewport (e.g. a worksheet) must not be
     vertically centered, or the flex algorithm pushes its top half above
     y=0 where it's clipped and invisible */
  .screen.top-align{ justify-content:flex-start; padding-top:8px; }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Back arrow (flecha transversal) ---------- */
  .back-btn{
    position:fixed;
    top:18px;
    left:18px;
    width:56px;
    height:56px;
    border-radius:50%;
    border:none;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(18,34,74,.28);
    z-index:50;
    transition:transform .18s ease, background .18s ease;
  }
  .back-btn:hover{ transform:translateY(-2px) scale(1.06); background:var(--blue); }
  .back-btn:active{ transform:scale(.94); }
  .back-btn svg{
    width:26px;
    height:26px;
    transform:rotate(-45deg);
  }

  /* ---------- Robot (shared component, real illustration) ---------- */
  .robot-slot{
    display:block;
    flex-shrink:0;
  }
  .robot-slot--home{ width:min(42vw, 180px); }
  .robot-slot--menu{ width:min(34vw, 150px); }
  .robot-slot--session{ width:82px; }

  .robot-wrap{ position:relative; display:block; }
  .robot-img{
    display:block;
    width:100%;
    height:auto;
    mix-blend-mode:multiply;
    user-select:none;
    -webkit-user-drag:none;
  }
  /* box-shadow (not filter) so it doesn't isolate the image's mix-blend-mode */
  .robot-shadow{
    position:absolute;
    bottom:2%;
    left:50%;
    transform:translateX(-50%);
    width:52%;
    height:7%;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(18,34,74,.32) 0%, rgba(18,34,74,0) 75%);
    pointer-events:none;
  }

  /* uses top/position instead of transform so it doesn't create a stacking
     context that would isolate the robot image's mix-blend-mode from the
     page background */
  .robot-float{ position:relative; animation:floaty 3.2s ease-in-out infinite; }
  @keyframes floaty{
    0%,100%{ top:0;}
    50%{ top:-10px;}
  }

  /* eyelids: closed (scaleY 0) most of the time, briefly cover the eyes to blink */
  .robot-eyelid{
    position:absolute;
    top:14.6%;
    width:9.8%;
    height:18.4%;
    border-radius:50%;
    background:#1c3a76;
    transform-origin:top center;
    transform:scaleY(0);
    animation: robotBlink 5s ease-in-out infinite;
    pointer-events:none;
  }
  .robot-eyelid-l{ left:30.8%; }
  .robot-eyelid-r{ left:57.7%; }
  @keyframes robotBlink{
    0%, 92%, 100% { transform:scaleY(0); }
    95% { transform:scaleY(1); }
  }

  /* glints: small highlight that shifts toward the pointer for a "looking" effect */
  .robot-glint{
    position:absolute;
    top:17.8%;
    width:2.3%;
    aspect-ratio:1;
    border-radius:50%;
    background:#ffffff;
    opacity:.85;
    pointer-events:none;
    transition:transform .12s ease-out;
  }
  .robot-glint-l{ left:33.4%; }
  .robot-glint-r{ left:60.3%; }

  /* ---------- HOME ---------- */
  .home-content{
    text-align:center;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:20px;
    user-select:none;
  }
  .home-content h1{
    font-size:clamp(42px, 10vw, 78px);
    margin:0;
    letter-spacing:2px;
    background:linear-gradient(90deg, var(--navy), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  .home-content h2{
    margin:0 0 6px;
    font-size:clamp(20px, 4.5vw, 30px);
    color:var(--blue);
    font-weight:600;
  }
  .home-content .robot-slot{ margin:14px 0 6px; }
  .hint{
    margin-top:10px;
    font-size:clamp(14px,3vw,17px);
    color:#5a6a94;
    padding:10px 22px;
    background:#ffffffb0;
    border:1px solid var(--card-border);
    border-radius:999px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }

  /* ---------- MENU (choose unit) ---------- */
  .menu-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:100%;
  }
  .bubble{
    position:relative;
    background:var(--card);
    border:2px solid var(--card-border);
    border-radius:22px;
    padding:20px 22px;
    box-shadow:var(--shadow);
    margin-top:20px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .bubble::before{
    content:"";
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:20px;height:20px;
    background:var(--card);
    border-left:2px solid var(--card-border);
    border-top:2px solid var(--card-border);
  }
  .bubble-question{
    margin:0 0 16px;
    font-size:clamp(16px,3.4vw,19px);
    font-weight:700;
    color:var(--navy-2);
  }
  .bubble-choices{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .choice-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:#f4f8ff;
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:12px 14px;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
  }
  .choice-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 22px rgba(18,34,74,.18);
    background:var(--navy);
    color:#fff;
  }
  .choice-btn:active{ transform:translateY(-1px) scale(.98); }
  .choice-num{
    width:38px;height:38px;
    flex-shrink:0;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
  }
  .choice-text{ display:flex; flex-direction:column; line-height:1.3; }
  .choice-text b{ font-size:15px; }
  .choice-text small{ font-size:12.5px; opacity:.75; font-weight:500; }

  /* ---------- UNIT SESSION GRID ---------- */
  .unit-title{
    text-align:center;
    font-size:clamp(20px,4vw,28px);
    margin:0 0 22px;
    color:var(--navy);
    padding:0 60px;
  }
  .unit-sub{
    text-align:center;
    color:var(--blue);
    font-weight:600;
    margin:-14px 0 26px;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .session-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(140px,1fr));
    gap:18px;
    width:100%;
    max-width:640px;
  }
  .session-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:24px 12px;
    text-align:center;
    cursor:pointer;
    font-size:clamp(15px,3vw,18px);
    font-weight:700;
    color:var(--navy-2);
    box-shadow:0 8px 18px rgba(18,34,74,.1);
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .session-btn .dot{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#fff; display:flex;align-items:center;justify-content:center;
    font-size:15px; font-weight:800;
  }
  .session-btn:hover{
    transform:translateY(-5px);
    box-shadow:0 16px 26px rgba(18,34,74,.18);
    background:var(--navy);
    color:#fff;
  }
  .session-btn:hover .dot{ background:#fff; color:var(--navy); }
  .session-btn:active{ transform:translateY(-1px) scale(.97); }

  /* ---------- SESSION: header (robot + badge + title) ---------- */
  .session-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:24px;
  }
  .session-header .robot-slot{ margin-bottom:12px; }
  .session-header .badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#fff;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    margin-bottom:10px;
  }
  .session-header h2{ margin:0; color:var(--navy); }

  #sessionBody{ width:100%; display:flex; justify-content:center; }

  .session-placeholder{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 30px;
    text-align:center;
    max-width:560px;
    width:100%;
  }
  .session-placeholder p{ color:#5a6a94; line-height:1.5; margin:0; }

  /* ---------- SESSION: worksheet (rich per-session content) ---------- */
  .worksheet{
    width:100%;
    max-width:820px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .meta-box{
    background:linear-gradient(135deg, var(--navy), var(--navy-2));
    color:#fff;
    border-radius:var(--radius);
    padding:22px 26px;
    box-shadow:var(--shadow);
  }
  .meta-label{
    display:inline-block;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    background:rgba(255,255,255,.18);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .meta-text{ margin:0 0 14px; font-size:clamp(15px,2.6vw,18px); font-weight:600; line-height:1.45; }
  .criteria-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .flipped-card{
    background:linear-gradient(135deg,#fff4e0,#ffe9c7);
    border:1px solid #f0d5a0;
    border-radius:var(--radius);
    padding:22px 24px;
    box-shadow:var(--shadow);
  }
  .flipped-badge{
    display:inline-block;
    background:#f5a623;
    color:#fff;
    font-weight:800;
    font-size:12px;
    letter-spacing:1px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .flipped-card h3{ margin:6px 0 10px; color:#7a4a12; font-size:clamp(17px,3vw,20px); }
  .flipped-card .ws-text{ color:#8a6a2e; margin:0 0 16px; }
  .flipped-actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .flipped-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .flipped-btn.view{ background:#fff; color:#a86a10; border:1px solid #f0d5a0; }
  .flipped-btn.download{ background:linear-gradient(135deg,#f5a623,#f57c23); color:#fff; }
  .flipped-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(150,100,20,.25); }

  .activity-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 24px;
  }
  .activity-head{ margin-bottom:16px; }
  .activity-tag{
    display:block;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:4px;
  }
  .activity-head h3{ margin:0 0 10px; font-size:clamp(17px,3vw,21px); color:var(--navy); }
  .ficha-badge{
    display:inline-block;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#fff;
    font-weight:700;
    font-size:12.5px;
    padding:5px 12px;
    border-radius:999px;
  }
  .ws-instruction{ font-weight:700; color:var(--navy-2); margin:20px 0 10px; }
  .ws-instruction:first-of-type{ margin-top:6px; }
  .ws-text{ color:#5a6a94; line-height:1.55; margin:0 0 6px; }
  .case-list{ margin:0 0 6px; padding-left:20px; color:#3a4a72; line-height:1.55; }
  .case-list li{ margin-bottom:10px; }
  .case-list b{ color:var(--navy); }
  .table-scroll{ overflow-x:auto; border-radius:12px; border:1px solid var(--card-border); }
  .ws-table{ width:100%; border-collapse:collapse; min-width:520px; font-size:13.5px; }
  .ws-table th{
    background:#eef4ff;
    color:var(--navy);
    text-align:left;
    padding:10px 12px;
    font-size:12.5px;
    border-bottom:2px solid var(--card-border);
  }
  .ws-table td{
    padding:16px 12px;
    border-bottom:1px solid var(--card-border);
    color:#5a6a94;
  }
  .ws-table tr:last-child td{ border-bottom:none; }
  .ws-table td:first-child{ font-weight:700; color:var(--navy-2); }
  .ws-team{ font-weight:600; color:var(--navy-2); margin:0; }
  .fill-blank{ display:inline-block; min-width:200px; border-bottom:2px solid var(--card-border); }
  .cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:10px 0; }
  .mini-card{
    background:#f4f8ff;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    color:#3a4a72;
    line-height:1.5;
  }
  .mini-card b{ color:var(--navy); }
  .ws-hint{ font-size:13.5px; color:#5a6a94; margin:10px 0 0; }
  .support-box{
    background:#f4f8ff;
    border:1px dashed #c7d3ea;
    border-radius:14px;
    padding:16px 18px;
  }
  .support-box p{ margin:0 0 8px; font-style:italic; color:#3a4a72; font-size:13.5px; }
  .support-box p:last-child{ margin-bottom:0; }
  .tip-box{
    background:#fff7e6;
    border:1px solid #f3dfa8;
    border-radius:14px;
    padding:14px 18px;
    margin:10px 0;
  }
  .tip-box ul{ margin:0; padding-left:20px; color:#7a5c14; font-size:13.5px; line-height:1.6; }
  .tip-box li{ margin-bottom:4px; }
  .reading-box{
    background:#f4f8ff;
    border-left:4px solid var(--blue);
    border-radius:0 14px 14px 0;
    padding:16px 20px;
    margin:10px 0;
  }
  .reading-box p{ margin:0 0 10px; color:#3a4a72; line-height:1.6; font-size:14px; }
  .reading-box p:last-of-type{ margin-bottom:0; }
  .reading-source{ display:block; margin-top:10px; font-size:11.5px; font-style:italic; color:#8b9ac1; }
  .fill-list{ list-style:none; margin:10px 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .fill-list li{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; color:#3a4a72; font-size:14px; }
  .fill-blank.small{ min-width:90px; }
  .unit{ color:#8b9ac1; font-size:13px; }
  .write-lines{ position:relative; border-bottom:2px solid var(--card-border); min-height:34px; margin:14px 0 10px; }
  .write-lines.three{ min-height:96px; }
  .wl-label{
    position:absolute;
    top:-10px;
    left:0;
    background:var(--card);
    padding:0 6px;
    font-size:11.5px;
    font-weight:700;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  /* ---------- Mobile tweaks ---------- */
  @media (max-width:560px){
    .session-grid{ grid-template-columns:repeat(2, 1fr); }
    .unit-title{ padding:0 50px; }
    .back-btn{ width:48px; height:48px; top:14px; left:14px; }
    .back-btn svg{ width:22px; height:22px; }
    #app{ padding:16px 14px 40px; }
    .cards-grid{ grid-template-columns:1fr; }
    .activity-card{ padding:20px 16px; }
    .meta-box{ padding:18px 18px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="home-content" id="homeTap">
      <h1>CIENCIA</h1>
      <h2>4to Bimestre</h2>
      <div class="robot-slot robot-slot--home robot-float" data-robot></div>
      <div class="hint">👉 Toca la pantalla para comenzar</div>
    </div>
  </section>

  <!-- MENU: choose unit -->
  <section class="screen" id="screen-menu">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="menu-wrap">
      <div class="robot-slot robot-slot--menu robot-float" data-robot></div>
      <div class="bubble">
        <p class="bubble-question">¿Qué unidad deseas aprender? 🤖</p>
        <div class="bubble-choices">
          <button class="choice-btn" onclick="goTo('unit7')">
            <span class="choice-num">7</span>
            <span class="choice-text"><b>Unidad 7</b><small>Microorganismos en acción</small></span>
          </button>
          <button class="choice-btn" onclick="goTo('unit8')">
            <span class="choice-num">8</span>
            <span class="choice-text"><b>Unidad 8</b><small>El sistema reproductor humano</small></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- UNIT 7 -->
  <section class="screen" id="screen-unit7">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="unit-sub">Unidad 7</div>
    <h2 class="unit-title">Microorganismos en acción</h2>
    <div class="session-grid" id="grid-unit7"></div>
  </section>

  <!-- UNIT 8 -->
  <section class="screen" id="screen-unit8">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="unit-sub">Unidad 8</div>
    <h2 class="unit-title">El sistema reproductor humano</h2>
    <div class="session-grid" id="grid-unit8"></div>
  </section>

  <!-- SESSION CONTENT -->
  <section class="screen" id="screen-session">
    <button class="back-btn" onclick="goBack()" aria-label="Regresar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-7 7 7 7"/><path d="M2 12h20"/></svg>
    </button>
    <div class="session-header">
      <div class="robot-slot robot-slot--session" data-robot></div>
      <div class="badge" id="sessionUnitLabel">UNIDAD</div>
      <h2 id="sessionTitle">Sesión 1</h2>
    </div>
    <div id="sessionBody"></div>
  </section>

</div>

<script>
  // ---------- Instantiate the robot into every slot ----------
  const robotInstances = [];
  document.querySelectorAll('[data-robot]').forEach((slot, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'robot-wrap';
    wrap.innerHTML = `
      <span class="robot-shadow"></span>
      <img class="robot-img" src="robot.png" alt="Robot">
      <span class="robot-eyelid robot-eyelid-l"></span>
      <span class="robot-eyelid robot-eyelid-r"></span>
      <span class="robot-glint robot-glint-l"></span>
      <span class="robot-glint robot-glint-r"></span>
    `;
    const eyelidL = wrap.querySelector('.robot-eyelid-l');
    const eyelidR = wrap.querySelector('.robot-eyelid-r');
    const delay = (i * 0.4) + 's';
    eyelidL.style.animationDelay = delay;
    eyelidR.style.animationDelay = delay;
    slot.appendChild(wrap);

      glintL: wrap.querySelector('.robot-glint-l'),
      glintR: wrap.querySelector('.robot-glint-r')
    });

  // ---------- Eyes (glints) follow the pointer / touch ----------
  let ticking = false;

  function updateEyes(px, py){
    robotInstances.forEach(inst => {
      const rect = inst.wrap.getBoundingClientRect();
      if(rect.width === 0) return;
      const cx = rect.left + rect.width * 0.485;
      const cy = rect.top + rect.height * 0.24;
      const dx = px - cx;
      const dy = py - cy;
      const dist = Math.min(1, Math.sqrt(dx*dx + dy*dy) / 220);
      const angle = Math.atan2(dy, dx);
      const maxOffset = rect.width * 0.022;
      const ox = Math.cos(angle) * maxOffset * dist;
      const oy = Math.sin(angle) * maxOffset * 0.6 * dist;
      const t = `translate(${ox}px, ${oy}px)`;
      inst.glintL.style.transform = t;
      inst.glintR.style.transform = t;
    });
    ticking = false;
  }

  function queueEyeUpdate(px, py){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => updateEyes(px, py));
  }

  window.addEventListener('mousemove', e => queueEyeUpdate(e.clientX, e.clientY));

  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if(t) queueEyeUpdate(t.clientX, t.clientY);
  }, { passive:true });
