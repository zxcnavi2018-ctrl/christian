<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorio de Moli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
body{display:flex;flex-direction:column}
.grid{flex:1;min-height:0;width:min(100%,980px);margin:0 auto;padding:4px 14px 16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(8px,1.6vw,18px)}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:0;padding:clamp(8px,1.4vw,16px);border-radius:clamp(16px,2vw,24px);color:#fff;text-decoration:none;overflow:hidden;background:var(--g);box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);animation:pop .5s calc(.06s * var(--i)) cubic-bezier(.2,1.3,.4,1) both;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card:active{transform:scale(.96)}
.card:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.card .art{position:absolute;inset:0 0 34% 0;display:grid;place-items:center}
.card .art svg{width:min(78%,150px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.card b{position:relative;font-size:clamp(12px,1.9vw,19px);font-weight:900;line-height:1.08;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.card small{position:relative;font-size:clamp(10px,1.3vw,13px);font-weight:800;opacity:.92}
.card .st{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.28);font-size:clamp(9px,1.2vw,12px);font-weight:900}
.card.lock{filter:saturate(.35) brightness(.75)}
.card.lock .art{opacity:.75}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.center img{width:min(88%,190px);max-height:72%;object-fit:contain;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));animation:mbob 3s ease-in-out infinite}
.center p{margin:0;padding:7px 12px;border-radius:14px;background:#fff;color:#14224a;font-weight:900;font-size:clamp(11px,1.5vw,15px);text-align:center;line-height:1.2}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
</style>
</head>
<body>
<header class="lab-top"><b>🧪 Laboratorio de Moli</b></header>
<main class="grid" id="grid"></main>
<script>
const U=new URLSearchParams(location.search).get('u')||'anon';
const get=k=>{try{return JSON.parse(localStorage.getItem('lab:'+U+':'+k)||'{}')}catch(e){return{}}};
const ART={
circ:'<svg viewBox="0 0 120 100"><rect x="14" y="58" width="52" height="26" rx="6" fill="#1f2937"/><rect x="18" y="62" width="20" height="18" rx="4" fill="#f59e0b"/><rect x="42" y="62" width="20" height="18" rx="4" fill="#f59e0b"/><path d="M66 70 C90 70 92 58 92 46" stroke="#ef4444" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M14 70 C2 70 4 30 30 22 C50 16 70 22 80 30" stroke="#111827" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="92" cy="34" r="20" fill="#fde68a"/><circle cx="92" cy="34" r="30" fill="#fde047" opacity=".35"/><path d="M85 36 l4-6 4 6 4-6" stroke="#b45309" stroke-width="2.5" fill="none"/></svg>',
plac:'<svg viewBox="0 0 120 100"><circle cx="60" cy="50" r="40" fill="#1d6fd8"/><path d="M34 30c8-6 18-4 22 2s-2 12 4 16-6 14-14 10-16-6-16-14 0-10 4-14z" fill="#4ade80"/><path d="M70 22c10 2 18 10 18 18s-8 8-12 14-2 14-8 12-6-12-4-18-4-12-2-18 4-8 8-8z" fill="#86efac"/><path d="M22 52 C40 46 54 60 70 54 S94 46 98 54" stroke="#fde047" stroke-width="3" fill="none" stroke-dasharray="5 4"/><path d="M58 12 C54 30 66 44 58 62 S60 84 56 90" stroke="#f97316" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="60" cy="50" r="40" fill="none" stroke="#bfdbfe" stroke-width="3" opacity=".6"/></svg>',
ener:'<svg viewBox="0 0 120 100"><ellipse cx="60" cy="74" rx="52" ry="18" fill="#1d6fd8"/><ellipse cx="60" cy="70" rx="40" ry="13" fill="#facc15"/><ellipse cx="60" cy="66" rx="34" ry="10" fill="#4ade80"/><rect x="30" y="44" width="10" height="20" fill="#e5e7eb"/><rect x="44" y="38" width="12" height="26" fill="#f1f5f9"/><rect x="60" y="48" width="9" height="16" fill="#e5e7eb"/><path d="M84 64V30" stroke="#fff" stroke-width="3"/><path d="M84 30l-14-6M84 30l12-10M84 30l2 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="16" r="9" fill="#fde047"/><rect x="72" y="56" width="20" height="9" fill="#38bdf8" transform="skewX(-15)"/></svg>'
};
const C=[
 {k:'circ',t:'Circuitos simples y compuestos',s:'Arma y enciende',href:'circuitos.html',g:'linear-gradient(150deg,#f59e0b,#ef4444 70%)',n:2},
 {k:'plac',t:'Placas tectónicas',s:'Gira el planeta',href:'placas.html',g:'linear-gradient(150deg,#0ea5e9,#2563eb 70%)',n:2},
 {k:'ener',t:'Energías renovables y no renovables',s:'Salva tu isla',href:'energias.html',g:'linear-gradient(150deg,#22c55e,#0d9488 70%)',n:3},
 {k:'evo',t:'Evolución con Darwin',s:'¿Sobrevivirás?',href:'evolucion.html',e:'🦒',g:'linear-gradient(150deg,#a16207,#65a30d)',n:4},
 {k:'enf',t:'Enfermedades',s:'Duelo de cartas',href:'enfermedades.html',e:'🦠',g:'linear-gradient(150deg,#e11d48,#7c3aed)',n:3},
 {k:'sol',t:'Sistema solar',e:'🪐',g:'linear-gradient(150deg,#8b5cf6,#4338ca)'},
 {k:'cad',t:'Cadena alimenticia',e:'🦊',g:'linear-gradient(150deg,#84cc16,#15803d)'},
 {k:'iman',t:'Fuerzas e imanes',e:'🧲',g:'linear-gradient(150deg,#f43f5e,#7c3aed)'}
];
const card=(c,i)=>{const done=c.n?Object.values(get(c.k)).filter(Boolean).length:0;const st=!c.href?'🔒 Pronto':done>=c.n?'✅ Listo':c.n?`🎯 ${done}/${c.n}`:'';const art=ART[c.k]||`<svg viewBox="0 0 120 100"><text x="60" y="66" font-size="54" text-anchor="middle">${c.e}</text></svg>`;
 return c.href?`<a class="card" href="${c.href}?u=${encodeURIComponent(U)}" style="--g:${c.g};--i:${i}"><span class="art">${art}</span><span class="st">${st}</span><b>${c.t}</b><small>${c.s}</small></a>`:`<div class="card lock" style="--g:${c.g};--i:${i}" aria-disabled="true"><span class="art">${art}</span><span class="st">${st}</span><b>${c.t}</b><small>Muy pronto</small></div>`};
const g=document.getElementById('grid');
g.innerHTML=C.slice(0,4).map(card).join('')+'<div class="center"><img src="../guia/img/moli.webp" alt="Moli"><p>¡Elige un experimento! 🔬</p></div>'+C.slice(4).map((c,i)=>card(c,i+4)).join('');
</script>
</body>
</html>
