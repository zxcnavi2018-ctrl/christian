      <div class="q-num">Pregunta ${tk.i + 1} de ${total}</div>
      <h3 class="q-text">${esc(q.q)}</h3>
      <div class="opts">${tk.order[tk.i].map((o, k) => `<button type="button" class="opt" data-opt="${k}"><span class="opt-l">${LETTERS[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div id="tkWhy"></div>
      <div class="tk-foot"><button type="button" class="btn solid" id="tkNext" hidden>${tk.i === total - 1 ? 'Ver mi resultado 🎉' : 'Siguiente →'}</button></div>
    </div>`;
  }
  function answer(k){
    const q = tk.qs[tk.i], opts = tk.order[tk.i], chosen = opts[k], ok = chosen.i === q.answer;
    const rightK = opts.findIndex(o => o.i === q.answer);
    tk.answers[tk.i] = { ok, chosen: chosen.t, right: rightK >= 0 ? opts[rightK].t : '' };
    $$('.opt', tkBody).forEach((b, j) => {
      b.disabled = true;
      if(j === rightK) b.classList.add('right');
      else if(j === k) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const say = $('#tkSay'), robot = $('.say-row .robot', tkBody);
    if(ok){
      say.className = 'say good';
      say.textContent = ['¡Correcto! 🎉', '¡Muy bien! 🌟', '¡Excelente! 🙌'][tk.i % 3];
      react(robot);
    } else {
      say.className = 'say bad';
      say.textContent = rightK >= 0 ? `¡Casi! La respuesta correcta es la ${LETTERS[rightK]} 💡` : '¡Casi! 💡';
      robot.classList.add('oops');
    }
    if(filled(q.why)) $('#tkWhy').innerHTML = `<p class="why">💡 ${esc(q.why)}</p>`;
    const next = $('#tkNext');
    next.hidden = false;
    next.focus({ preventScroll:true });
    next.scrollIntoView({ block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  async function send(){
    const box = $('#tkSend');
    const set = (cls, html) => { if(box){ box.className = 'send ' + cls; box.innerHTML = html; } };
    const res = tk.res;
    const c = await fbConfig();
    if(!c){
      const list = lsGet(RES_KEY, []); list.push(res); lsSet(RES_KEY, list);
      markDone(res.id);
      set('ok', '💾 Resultado guardado en este dispositivo.');
      return;
    }
    set('wait', '<span class="spin"></span> Enviando tu resultado a tu profesor(a)…');
    try{
      const r = await cloudSubmit(c, res);
      markDone(res.id);
      set(r === 'dup' ? 'warn' : 'ok', r === 'dup' ? '📌 Ya habías enviado este exit ticket antes; se conserva tu primer resultado.' : '✅ ¡Resultado enviado a tu profesor(a)!');
    }catch(e){
      const q = lsGet(QUEUE_KEY, []);
      if(!q.some(x => x.id === res.id)){ q.push(res); lsSet(QUEUE_KEY, q); }
      markDone(res.id);
      set('warn', '📶 No se pudo enviar en este momento. Tu resultado quedó guardado en este equipo y se enviará solo más tarde. <button type="button" class="btn ghost" data-tk="resend">Reintentar ahora</button>');
    }
  }
  function markDone(id){ const d = lsGet(DONE_KEY, {}); d[id] = Date.now(); lsSet(DONE_KEY, d); }

  function stepResult(){
    const total = tk.qs.length, score = tk.answers.filter(a => a && a.ok).length, pct = Math.round(score / total * 100);
    const stars = Math.round(score / total * 5);
    tk.score = score;
    const u = unitByKey(tk.unit);
    if(!tk.practice && !tk.res){
      tk.res = { id: tk.id, unit: tk.unit, unitNum: u.num, n: tk.n, section: tk.section, name: tk.name, score, total, answers: tk.answers.map(a => !!a.ok), at: Date.now() };
    }
    const nm = firstName();
    const msg = score === total ? `¡Perfecto, ${nm}! Dominas el tema 🏆`
      : pct >= 80 ? `¡Muy bien, ${nm}! Aprendiste mucho hoy 🌟`
      : pct >= 60 ? `¡Buen trabajo, ${nm}! Repasa lo que fallaste 💪`
      : `¡Sigue practicando, ${nm}! Revisa la ficha para reforzar 📚`;
    tkHead(who(), 100);
    tkBody.innerHTML = `<div class="tk-step">
      ${sayRow(msg, pct >= 60 ? 'good' : '')}
      <div class="score">
        <div class="ring" style="--p:${pct}"><b>${score}/${total}</b></div>
        <div class="score-text"><strong>${score} de ${total} respuestas correctas</strong><span>${new Date().toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long' })}</span>
          <div class="stars" aria-label="${stars} de 5 estrellas">${[0, 1, 2, 3, 4].map(i => `<i class="${i < stars ? 'on' : ''}" style="animation-delay:${.15 + i * .12}s">⭐</i>`).join('')}</div></div>
      </div>
      ${tk.practice ? '<div class="send warn">🧪 Modo prueba: este resultado no se guarda ni se envía.</div>' : '<div class="send wait" id="tkSend"></div>'}
      <ul class="review">${tk.qs.map((q, i) => { const a = tk.answers[i]; return `<li class="${a.ok ? '' : 'no'}"><span>${a.ok ? '✓' : '✕'}</span><div>${esc(q.q)}${a.ok ? '' : `<small>Respuesta correcta: ${esc(a.right)}</small>`}</div></li>`; }).join('')}</ul>
      <div class="tk-actions">
        <button type="button" class="btn solid" data-tk="png">📸 Guardar imagen</button>
        ${tk.practice ? '<button type="button" class="btn ghost" data-tk="retry">🔁 Probar de nuevo</button>' : ''}
        <button type="button" class="btn up" data-tk="close">✔ Terminar</button>
      </div>
    </div>`;
    if(!tk.practice) send();
    const robot = $('.say-row .robot', tkBody);
    if(pct >= 60) setTimeout(() => react(robot), 250);
    if(pct >= 80 && !reduceMotion){
      const c = document.createElement('div');
      c.className = 'confetti';
      const colors = ['#2f6fed', '#38d1f5', '#f5a623', '#34c170', '#5b4fe0', '#f57c23'];
      c.innerHTML = Array.from({ length: 46 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${Math.random() * .6}s;animation-duration:${1.8 + Math.random() * 1.4}s;transform:rotate(${Math.random() * 180}deg)"></i>`).join('');
      tkBody.appendChild(c);
      setTimeout(() => c.remove(), 3600);
    }
  }
  function resultPng(){
    const u = unitByKey(tk.unit), total = tk.qs.length, score = tk.score;
    const W = 1000, H = 640, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#12224a'); bg.addColorStop(1, '#2f6fed');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
    g.fillStyle = '#ffffff'; rr(40, 40, W - 80, H - 80, 34); g.fill();
    const F = (w, s) => `${w} ${s}px Nunito, "Segoe UI", Roboto, Arial, sans-serif`;
    g.fillStyle = '#2f6fed'; g.font = F(900, 22); g.fillText('EXIT TICKET · CIENCIA 4TO BIMESTRE', 90, 112);
    g.fillStyle = '#4a5a86'; g.font = F(700, 24); g.fillText(`Unidad ${u.num} · Sesión ${tk.n} · ${u.title}`.slice(0, 64), 90, 150);
    g.fillStyle = '#12224a'; g.font = F(900, 50); g.fillText(tk.name.slice(0, 32), 90, 238);
    g.fillStyle = '#4a5a86'; g.font = F(800, 28); g.fillText(`${GRADE} grado · Sección ${tk.section}`, 90, 284);
    g.fillStyle = '#f4f8ff'; rr(90, 330, 520, 190, 26); g.fill();
    g.fillStyle = '#12224a'; g.font = F(900, 96); g.fillText(`${score}/${total}`, 124, 450);
    g.fillStyle = '#4a5a86'; g.font = F(800, 24); g.fillText('respuestas correctas', 124, 494);
    const stars = Math.round(score / total * 5);
    for(let i = 0; i < 5; i++){
      const cx = 700 + i * 44, cy = 420;
      g.beginPath();
      for(let k = 0; k < 10; k++){ const r = k % 2 ? 9 : 20, a = -Math.PI / 2 + k * Math.PI / 5; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      g.closePath(); g.fillStyle = i < stars ? '#f5a623' : '#dfe8fb'; g.fill();
    }
    g.fillStyle = '#7d8bb0'; g.font = F(700, 22);
    g.fillText(new Date().toLocaleString('es-PE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }), 90, 568);
    cv.toBlob(b => {
      const url = URL.createObjectURL(b);
      download(url, `exit-ticket-u${u.num}-s${tk.n}-${GRADE}${tk.section}-${slug(tk.name)}.png`);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('📸 Resultado guardado como imagen');
    }, 'image/png');
  }

  /* ---------- teacher: results by section ---------- */
  let panel = null;
  const sessionsWithTicket = () => APP.units.flatMap(u => u.sessions.map((s, i) => ({ u, n: i + 1, s })).filter(x => playable(x.s).length));
  const fmtDate = t => new Date(t).toLocaleString('es-PE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

  async function showResults(unit, n){
    const list = sessionsWithTicket();
    const first = list[0];
    panel = { key: unit && n ? `${unit}|${n}` : first ? `${first.u.key}|${first.n}` : '', section: (panel && panel.section) || 'A', email: panel && panel.email, rows: null, err: '' };
    tk = null;
    if(!tkDlg.open) tkDlg.showModal();
    await loadPanel();
  }
  async function loadPanel(){
    const c = await fbConfig();
    panel.cloud = !!c;
    panel.err = '';
    panel.rows = null;
    if(c && !auth()){ renderPanel(); return; }
    renderPanel();
    try{
      panel.rows = c ? await cloudList(c) : lsGet(RES_KEY, []).map(r => ({ ...r, section: r.section || '—' }));
    }catch(e){
      if(e.message === 'AUTH' || e.message === 'DENIED'){
        const who = (auth() || {}).email;
        try{ localStorage.removeItem(AUTH_KEY); }catch(_){}
        panel.err = e.message === 'DENIED' ? `La cuenta ${who || ''} no tiene permiso para ver los resultados. Ingresa con tu cuenta de docente.` : '';
      }
      else panel.err = 'No se pudieron cargar los resultados. Revisa tu conexión a internet.';
      panel.rows = [];
    }
    renderPanel();
  }
  function panelRows(){
    const [unit, n] = panel.key.split('|');
    return (panel.rows || []).filter(r => r.unit === unit && +r.n === +n);
  }
  function renderPanel(){
    const list = sessionsWithTicket();
    const cloudNoAuth = panel.cloud && !auth();
    tkTop.innerHTML = `<small>📊 Resultados · Exit ticket</small><strong>${GRADE} grado</strong>
      <span>${panel.cloud ? '☁️ En línea (Firebase)' + (auth() ? ' · ' + esc(auth().email) : '') : '💾 Solo este dispositivo (sin Firebase)'}</span>
      <button class="tk-x" type="button" data-tk="close" aria-label="Cerrar">✕</button>`;
    if(cloudNoAuth){
      tkBody.innerHTML = `<div class="tk-step">
        ${sayRow('Hola, profe 👩‍🏫 Ingresa con tu cuenta de docente para ver los resultados.')}
        <form class="login" id="loginForm">
          <button type="button" class="btn g-btn" data-tk="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Ingresar con Google</button>
          <div class="or"><span>o con correo y contraseña</span></div>
          <div class="fld"><label for="lgEmail">Correo</label><input id="lgEmail" type="email" autocomplete="username" required value="${esc(panel.email || '')}"></div>
          <div class="fld"><label for="lgPass">Contraseña</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
          ${panel.err ? `<p class="send warn">${esc(panel.err)}</p>` : ''}
          ${panel.info ? `<p class="send ok">${esc(panel.info)}</p>` : ''}
          <div class="tk-actions"><button type="submit" class="btn solid">Ingresar</button><button type="button" class="btn ghost" data-tk="forgot">¿Olvidaste tu contraseña?</button></div>
        </form>
      </div>`;
      fbConfig().then(c => c && googleAuth(c)).catch(() => {});
      return;
    }
    const rows = panelRows();
    const bySec = s => rows.filter(r => r.section === s).sort((a, b) => a.name.localeCompare(b.name, 'es'));
    const cur = bySec(panel.section);
    const avg = cur.length ? cur.reduce((t, r) => t + r.score / r.total, 0) / cur.length : 0;
    const total = cur[0] ? cur[0].total : 5;
    tkBody.innerHTML = `<div class="tk-step">
      <div class="panel-bar">
        <select id="pnSession" aria-label="Sesión">${list.map(x => `<option value="${x.u.key}|${x.n}"${`${x.u.key}|${x.n}` === panel.key ? ' selected' : ''}>Unidad ${esc(x.u.num)} · Sesión ${x.n}</option>`).join('')}</select>
        <button type="button" class="btn ghost" data-tk="reload" title="Actualizar">🔄 Actualizar</button>
      </div>
      <div class="sec-tabs" role="tablist">${SECTIONS.map(s => `<button type="button" role="tab" class="sec-tab${s === panel.section ? ' on' : ''}" aria-selected="${s === panel.section}" data-tab="${s}"><b>${GRADE} ${s}</b><span>${panel.rows ? bySec(s).length : '…'}</span></button>`).join('')}</div>
      ${panel.err ? `<p class="send warn">${esc(panel.err)}</p>` : ''}
      ${!panel.rows ? '<p class="res-empty"><span class="spin"></span> Cargando resultados…</p>'
        : cur.length ? `
        <div class="sec-sum"><span><b>${cur.length}</b> estudiante${cur.length === 1 ? '' : 's'}</span><span>Promedio: <b>${(avg * total).toFixed(1)}/${total}</b></span><span>Logrado (≥ 60%): <b>${cur.filter(r => r.score / r.total >= .6).length}</b></span></div>
        <div style="overflow:auto"><table class="res-table"><thead><tr><th>N°</th><th>Estudiante</th><th>Nota</th><th>Fecha</th><th></th></tr></thead><tbody>
        ${cur.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td><span class="grade ${r.score / r.total >= .8 ? 'hi' : r.score / r.total >= .6 ? 'mid' : 'lo'}">${r.score}/${r.total}</span></td><td>${fmtDate(r.at)}</td>
          <td><button type="button" class="tq-mini rm" data-del="${esc(r.id)}" title="Borrar para que pueda volver a responder">🗑</button></td></tr>`).join('')}
        </tbody></table></div>`
        : `<p class="res-empty">Todavía no hay resultados del ${GRADE} ${panel.section} en esta sesión.</p>`}
      <div class="tk-actions" style="margin-top:16px">
        ${rows.length ? '<button type="button" class="btn solid" data-tk="csv">⬇️ Descargar para Excel (A, B, C y D)</button>' : ''}
        ${panel.cloud ? '<button type="button" class="btn ghost" data-tk="logout">Cerrar sesión</button>' : ''}
        <button type="button" class="btn ghost" data-tk="close">Cerrar</button>
      </div>
      ${panel.cloud ? '' : '<p class="drop-hint" style="text-align:left;margin-top:12px">Cuando publiques la página en Firebase Hosting, aquí verás los resultados de todos tus estudiantes.</p>'}
    </div>`;
  }
  function resultsCsv(){
    const [unit, n] = panel.key.split('|'), u = unitByKey(unit);
    const rows = panelRows().sort((a, b) => a.section.localeCompare(b.section) || a.name.localeCompare(b.name, 'es'));
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['Grado', 'Sección', 'Estudiante', 'Correctas', 'Total', 'Fecha y hora'].map(q).join(';')]
      .concat(rows.map(r => [GRADE, r.section, r.name, r.score, r.total, new Date(r.at).toLocaleString('es-PE')].map(q).join(';')));
    const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
    download(url, `exit-ticket-unidad${u.num}-sesion${n}-${GRADE}.csv`);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function openResults(){
    commitFocused();
    route.name === 'session' ? showResults(route.unit, route.n) : showResults();
  }

  /* ---------- dialog events ---------- */
  tkBody.addEventListener('input', e => {
    if(e.target.id !== 'tkName' || !tk) return;
    tk.name = e.target.value;
    $('#tkStart').disabled = !(cleanName(tk.name) && tk.section);
  });
  tkBody.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.id === 'tkName'){ e.preventDefault(); if(!$('#tkStart').disabled) beginTicket(); }
  });
  tkBody.addEventListener('change', e => {
    if(e.target.id === 'pnSession'){ panel.key = e.target.value; renderPanel(); }
  });
  tkBody.addEventListener('submit', async e => {
    if(e.target.id !== 'loginForm') return;
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Ingresando…';
    panel.email = $('#lgEmail').value.trim();
    panel.info = '';
    try{
      await signIn(await fbConfig(), $('#lgEmail').value.trim(), $('#lgPass').value);
      await loadPanel();
    }catch(err){
      panel.err = /CONFIGURATION_NOT_FOUND/.test(err.message) ? 'Falta activar Authentication en Firebase: Authentication → Comenzar → Correo electrónico/contraseña, y crea tu usuario en «Usuarios».'
        : /OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(err.message) ? 'Falta activar el ingreso con correo en Firebase: Authentication → Método de acceso → Correo electrónico/contraseña.'
        : /INVALID|NOT_FOUND|PASSWORD|CREDENTIAL/.test(err.message) ? 'Correo o contraseña incorrectos.' : /TOO_MANY/.test(err.message) ? 'Demasiados intentos. Espera un momento.' : 'No se pudo ingresar. Revisa tu conexión.';
      renderPanel();
    }
  });
  tkDlg.addEventListener('click', async e => {
    const t = e.target;
    if(t === tkDlg){ tkDlg.close(); return; }
    const o = t.closest('.opt');
    if(o && !o.disabled){ answer(+o.dataset.opt); return; }
    const sec = t.closest('[data-sec]');
    if(sec && tk){
      tk.section = sec.dataset.sec;
      $$('.sec', tkBody).forEach(b => { const on = b === sec; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      $('#tkStart').disabled = !(cleanName(tk.name) && tk.section);
      return;
    }
    if(t.closest('#tkStart')){ beginTicket(); return; }
    if(t.closest('#tkNext')){ tk.i++; tk.i < tk.qs.length ? stepQuestion() : stepResult(); return; }
    const tab = t.closest('[data-tab]');
    if(tab){ panel.section = tab.dataset.tab; renderPanel(); return; }
    const del = t.closest('[data-del]');
    if(del){
      const r = (panel.rows || []).find(x => x.id === del.dataset.del);
      if(!r || !confirm(`¿Borrar el resultado de ${r.name} (${GRADE} ${r.section})? Podrá volver a responder el exit ticket.`)) return;
      try{
        const c = await fbConfig();
        if(c) await cloudDelete(c, r.id);
        else lsSet(RES_KEY, lsGet(RES_KEY, []).filter(x => x.id !== r.id));
        const d = lsGet(DONE_KEY, {}); delete d[r.id]; lsSet(DONE_KEY, d);
        panel.rows = panel.rows.filter(x => x.id !== r.id);
        renderPanel();
        toast('🗑 Resultado borrado');
      }catch(err){ toast('⚠️ No se pudo borrar. Revisa tu conexión.'); }
      return;
    }
    const a = t.closest('[data-tk]');
    if(!a) return;
    const act = a.dataset.tk;
    if(act === 'close') tkDlg.close();
    else if(act === 'edit') stepIntro();
    else if(act === 'retry'){ tk.i = 0; tk.answers = []; tk.order = null; stepQuestion(); }
    else if(act === 'png') resultPng();
    else if(act === 'resend') send();
    else if(act === 'csv') resultsCsv();
    else if(act === 'reload') loadPanel();
    else if(act === 'google'){
      panel.err = ''; panel.info = '';
      a.disabled = true;
      try{
        await signInGoogle(await fbConfig());
        await loadPanel();
      }catch(err){
        panel.err = googleError(err);
        renderPanel();
      }
    }
    else if(act === 'forgot'){
      const email = ($('#lgEmail') && $('#lgEmail').value.trim()) || panel.email || '';
      panel.email = email;
      panel.info = '';
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ panel.err = 'Escribe primero tu correo y luego toca "¿Olvidaste tu contraseña?".'; renderPanel(); return; }
      a.disabled = true; a.textContent = 'Enviando…';
      try{
        const c = await fbConfig();
        const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${c.apiKey}`,
          { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ requestType:'PASSWORD_RESET', email }) });
        const j = await r.json().catch(() => ({}));
        if(!r.ok && !/EMAIL_NOT_FOUND/.test((j.error && j.error.message) || '')) throw new Error('x');
        panel.err = '';
        panel.info = `📧 Si ${email} es tu cuenta de docente, te llegará un correo para crear una nueva contraseña. Revisa también la carpeta de Spam.`;
      }catch(err){ panel.err = 'No se pudo enviar el correo. Revisa tu conexión e inténtalo otra vez.'; }
      renderPanel();
    }
    else if(act === 'logout'){ try{ localStorage.removeItem(AUTH_KEY); }catch(_){} loadPanel(); }
  });
  tkDlg.addEventListener('close', () => { tkBody.innerHTML = ''; panel = panel && { section: panel.section, email: panel.email }; });

  /* ================= Toast ================= */
  let toastEl = null, toastTimer = null;
  function toast(msg, actions = [], ms = 2600){
    if(toastEl) toastEl.remove();
    clearTimeout(toastTimer);
    toastEl = document.createElement('div');
    toastEl.className = 'toast';
    toastEl.setAttribute('role', 'status');
    toastEl.innerHTML = `<span>${esc(msg)}</span>`;
    actions.forEach(([label, fn], i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ' + (i ? 'ghost' : 'solid');
      b.textContent = label;
      b.onclick = () => { fn(); if(toastEl && toastEl.contains(b)) { toastEl.remove(); toastEl = null; } };
      toastEl.appendChild(b);
    });
    document.body.appendChild(toastEl);
    const el = toastEl;
    toastTimer = setTimeout(() => { if(el === toastEl){ el.remove(); toastEl = null; } }, ms);
  }

  /* ================= Fullscreen ================= */
  const fsBtn = $('#fsBtn');
  if(document.fullscreenEnabled){
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}));
    document.addEventListener('fullscreenchange', () => {
      const on = !!document.fullscreenElement;
      fsBtn.setAttribute('aria-label', on ? 'Salir de pantalla completa' : 'Pantalla completa');
      fsBtn.innerHTML = on
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    });
  }

  /* ================= Start ================= */
  const start = parse(location.hash);
  trail.push(toHash(start));
  history.replaceState(null, '', toHash(start));
  render(start, 'fwd');
})();
</script>
</body>
</html>
