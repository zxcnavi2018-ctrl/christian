vidad 02",file:"f3"}],ticket:{questions:[{q:"¿Qué es una enfermedad infecciosa?",options:["Es causada por un agente infeccioso como un virus, una bacteria, un hongo o un parásito","Es causada solo por dormir poco","Es una enfermedad que solo tienen los adultos mayores"],answer:0,why:"Las enfermedades infecciosas son causadas por agentes infecciosos y pueden propagarse."},{q:"La influenza y el dengue son enfermedades causadas por…",options:["La falta de hierro","Un virus","El exceso de azúcar en la sangre"],answer:1,why:"En los casos de Lucía y Mariana, el médico explicó que las causa un virus."},{q:"¿Cuál de estas enfermedades es NO infecciosa?",options:["Tuberculosis","Dengue","Diabetes"],answer:2,why:"La diabetes no es causada por virus, bacterias, hongos ni parásitos."},{q:"¿Cómo llega el dengue a las personas?",options:["Por la picadura de un mosquito infectado","Por comer alimentos con poco hierro","Por tomar agua muy fría"],answer:0,why:"El virus del dengue se transmite mediante la picadura de un mosquito infectado."},{q:"¿Cuál es la diferencia principal entre una enfermedad infecciosa y una no infecciosa?",options:["Las infecciosas nunca tienen síntomas","En la infecciosa interviene un agente infeccioso y puede propagarse; en la no infecciosa no","No hay ninguna diferencia entre ellas"],answer:1,why:"La clave está en la causa: si interviene o no un agente infeccioso."}]}},{title:"",meta:"Explica el fenómeno de la actividad de la levadura para delimitar una relación investigable.",criteria:["Observa","Registra","Describe"],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"Observamos y registramos la actividad de la levadura",desc:"Observan la fermentación de la levadura, registran los cambios en una tabla y analizan lo ocurrido.",ficha:"Ficha · Sesión 2",file:"f4"},{mode:"individual",title:"De los datos a una relación investigable",desc:"A partir de lo observado, identifican un factor que podrían modificar y medir en una próxima experiencia.",ficha:"Ficha · Sesión 2",file:"f4"}],ticket:{questions:[{q:"¿Qué es la levadura?",options:["Un microorganismo formado por una sola célula","Una planta con hojas y raíces","Un tipo de azúcar"],answer:0,why:"La levadura es un ser vivo microscópico formado por una sola célula."},{q:"¿Qué gas libera la levadura durante la fermentación?",options:["Oxígeno","Dióxido de carbono","Vapor de agua"],answer:1,why:"Durante la fermentación la levadura produce dióxido de carbono."},{q:"¿Qué necesita la levadura para realizar la fermentación?",options:["Solo luz solar","Sal y aceite","Agua, azúcar y una temperatura adecuada"],answer:2,why:"Con agua, azúcar y temperatura adecuada la levadura se activa."},{q:"¿Por qué se formó espuma en la mezcla?",options:["Por las burbujas del gas que liberó la levadura","Porque el agua se congeló","Porque el azúcar desapareció en el aire"],answer:0,why:"Las burbujas de dióxido de carbono ayudan a formar la espuma."},{q:"¿Con qué instrumento medimos la altura de la espuma?",options:["Con un termómetro","Con una regla","Con una balanza"],answer:1,why:"La altura se mide con una regla y se registra en centímetros."}]}},{title:"",meta:"Formula una pregunta que pueda responderse mediante una indagación experimental.",criteria:["Selecciona un factor","Selecciona un efecto","Relaciona causa y efecto"],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"Formulamos individualmente una pregunta de indagación",desc:"Cada estudiante identifica el factor y el efecto de la indagación, y formula su propia pregunta con el andamio dado.",ficha:"Ficha · Sesión 3",file:"f5"},{mode:"group",title:"Construimos la pregunta de indagación del equipo",desc:"En equipos de 3 o 4, comparan sus preguntas individuales y construyen y mejoran una pregunta grupal de indagación.",ficha:"Ficha · Sesión 3",file:"f5"}],ticket:{questions:[{q:"En nuestra indagación, ¿qué factor vamos a cambiar intencionalmente?",options:["La temperatura inicial del agua","El color del recipiente","La marca del azúcar"],answer:0,why:"Probaremos agua a 15 °C, 25 °C y 35 °C."},{q:"¿Qué efecto vamos a medir?",options:["El sabor de la mezcla","La altura de la espuma","El olor de la levadura"],answer:1,why:"El efecto es el resultado que observamos y medimos con un instrumento."},{q:"¿Con qué instrumento medimos la temperatura del agua?",options:["Con una regla","Con un cronómetro","Con un termómetro"],answer:2,why:"El termómetro mide la temperatura en grados Celsius (°C)."},{q:"¿Por qué usamos la misma cantidad de agua, azúcar y levadura en cada recipiente?",options:["Para que solo cambie la temperatura y la comparación sea justa","Para que la mezcla se vea más bonita","Para terminar más rápido"],answer:0,why:"Si solo cambia un factor, sabremos que el efecto se debe a ese factor."},{q:"¿Cuál es una buena pregunta de indagación?",options:["¿Te gusta el pan con levadura?","¿Cómo influye la temperatura inicial del agua en la altura de la espuma después de 20 minutos?","¿De qué color es la levadura?"],answer:1,why:"Relaciona el factor que cambiamos con el efecto que medimos."}]}},{title:"",meta:"",criteria:["","",""],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"",desc:"",ficha:"Ficha · Actividad 01",file:""},{mode:"group",title:"",desc:"",ficha:"Ficha · Actividad 02",file:""}],ticket:{questions:[]}},{title:"",meta:"",criteria:["","",""],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"",desc:"",ficha:"Ficha · Actividad 01",file:""},{mode:"group",title:"",desc:"",ficha:"Ficha · Actividad 02",file:""}],ticket:{questions:[]}},{title:"",meta:"",criteria:["","",""],flipped:{enabled:!1,title:"",desc:"",file:""},activities:[{mode:"individual",title:"",desc:"",ficha:"Ficha · Actividad 01",file:""},{mode:"group",title:"",desc:"",ficha:"Ficha · Actividad 02",file:""}],ticket:{questions:[]}},{title:"",meta:"",criteria:["","",""],flipped:{enabled:!1,title:"",desc:""
